# SonarCloud analysis run from CI (.github/workflows/ci.yml, job "sonar").
# Automatic Analysis must stay OFF in SonarCloud: it cannot import coverage and conflicts with CI analysis.
sonar.projectKey=PEI-aLinha_alinha
sonar.organization=pei-alinha
sonar.projectName=aLinha

# Only code that lives in this repo. Plugins are submodules with their own repos and analysis.
sonar.sources=.
sonar.tests=.
sonar.exclusions=plugins/**,**/__fixtures__/**,**/node_modules/**,**/build/**,**/dist/**,**/dist_keycloak/**,**/coverage/**,\
  **/src/test/**,**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.mjs,\
  frontend/shell/src/plugins.generated.ts,frontend/packages/api-client/src/schema.generated.ts
sonar.test.inclusions=**/src/test/**,workers/**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.mjs
sonar.test.exclusions=plugins/**,**/node_modules/**

# Compiled classes from the backend job (artifact "classes-backend"). Without them the Java analyser fails
# on the package-info.java files and the Kotlin analyser loses its semantic rules.
sonar.java.binaries=backend/*/build/classes/*/main,bff/build/classes/*/main

# Coverage reports produced by the backend, frontend and workers CI jobs. coverage/lcov.info: the root scripts/ and
# eslint-rules/ (node --test in `pnpm test`).
sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info,frontend/shell/coverage/lcov.info,frontend/packages/plugin-sdk/coverage/lcov.info,\
  frontend/packages/ui/coverage/lcov.info,frontend/keycloak-theme/coverage/lcov.info
sonar.python.coverage.reportPaths=workers/job_consumer/coverage.xml
sonar.python.version=3.12

sonar.sourceEncoding=UTF-8
