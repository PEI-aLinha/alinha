spring:
  application:
    name: alinha
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alinha}
    username: ${DB_USER:alinha}
    password: ${DB_PASSWORD:alinha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # the schema is ALWAYS created by Flyway migrations
  flyway:
    # Each plugin puts its migrations in db/migration/<plugin>/ — Flyway
    # scans recursively. Timestamp versions so they never collide:
    #   V202611071530__assessment_init.sql
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true           # Modulith event publication table

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

alinha:
  frameworks:
    # Folder with the framework catalogues (NFR18). Mounted into the container in production.
    dir: ${FRAMEWORKS_DIR:../../frameworks}