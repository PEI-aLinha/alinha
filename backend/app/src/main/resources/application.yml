spring:
  application:
    name: alinha
  # Secrets come from OpenBao (NFR09) — never put credentials here or in env defaults.
  # Dev: docker compose ... up -d, then BAO_TOKEN=dev-app-token ./gradlew :app:bootRun
  config:
    import: optional:vault://   # optional only so tests run with vault disabled; fail-fast below
  cloud:
    vault:
      uri: ${BAO_ADDR:http://localhost:8200}
      authentication: TOKEN
      token: ${BAO_TOKEN}
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        default-context: alinha/app
        application-name: alinha/app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alinha}
    username: ${db.username}
    password: ${db.password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # the schema is ALWAYS created by Flyway migrations
  flyway:
    # Each plugin puts its migrations in db/migration/<plugin>/ — Flyway
    # scans recursively. Timestamp versions so they never collide:
    #   V202611071530__assessment_init.sql
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true           # Modulith event publication table

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
