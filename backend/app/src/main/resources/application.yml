spring:
  application:
    name: alinha
  # Secrets come from OpenBao (NFR09) — never put credentials here or in env defaults.
  # Dev: docker compose ... up -d, then BAO_TOKEN=dev-app-token ./gradlew :app:bootRun
  config:
    import: optional:vault://   # optional only so tests run with vault disabled; fail-fast below
  cloud:
    vault:
      uri: ${BAO_ADDR:http://localhost:8200}
      authentication: TOKEN
      token: ${BAO_TOKEN}
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        default-context: alinha/app
        # Required: without it Spring Cloud Vault also reads secret/data/<spring.application.name> (alinha) and gets 403.
        application-name: alinha/app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/alinha}
          audiences: alinha-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alinha}
    username: ${db.username}
    password: ${db.password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # the schema is ALWAYS created by Flyway migrations
  flyway:
    # Migrations run as the schema owner; the app runs as alinha_app, which cannot change
    # audit.audit_event (RNF04) or create tables. Both credentials come from OpenBao.
    user: ${db.migration-username}
    password: ${db.migration-password}
    # Each plugin puts its migrations in db/migration/<plugin>/ — Flyway
    # scans recursively. Timestamp versions so they never collide:
    #   V202611071530__assessment_init.sql
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false          # table created by core migration V20261116090100

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

alinha:
  frameworks:
    # Folder with the framework catalogues (RNF18). Mounted into the container in production.
    dir: ${FRAMEWORKS_DIR:../../frameworks}
  identity:
    # Admin access to Keycloak for tenant provisioning (ADR 0004). The secret comes from OpenBao.
    base-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: alinha
    client-id: alinha-provisioner
    client-secret: ${identity.provisioner-secret:}

server:
  # Behind the BFF/Nginx: take the client IP from X-Forwarded-For only when the request comes from an internal
  # (private-range) proxy, so a client cannot choose its own (registration rate limit, ADR 0004).
  forward-headers-strategy: native
