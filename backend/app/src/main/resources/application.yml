spring:
  application:
    name: alinha
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alinha}
    username: ${DB_USER:alinha}
    password: ${DB_PASSWORD:alinha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é SEMPRE criado por migrações Flyway
  flyway:
    # Cada plugin põe as migrações em db/migration/<plugin>/ — o Flyway
    # procura recursivamente. Versões com timestamp para não colidirem:
    #   V202611071530__assessment_init.sql
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true           # tabela de publicação de eventos do Modulith

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
