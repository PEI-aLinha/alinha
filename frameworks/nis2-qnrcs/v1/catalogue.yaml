        text: "Os contratos com fornecedores permitem avaliar continuamente a sua cibersegurança e exigir a correção de falhas?"
        explanation: "Assim a empresa pode verificar o fornecedor ao longo do contrato e obrigá-lo a corrigir problemas."
        example: "Uma cláusula que permite auditorias anuais e dá 30 dias ao fornecedor para corrigir falhas encontradas."
