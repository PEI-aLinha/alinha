        text: "As comunicações dos sistemas da empresa com o exterior estão mapeadas, aprovadas e atualizadas?"
        explanation: "Saber que sistemas falam com o exterior, e com quem, ajuda a detetar ligações que não deviam existir."
        example: "Um documento que diz que só o servidor de email e o de faturação comunicam com a internet, e para onde."
        answers: ["yes", "partial", "no", "unknown"]

