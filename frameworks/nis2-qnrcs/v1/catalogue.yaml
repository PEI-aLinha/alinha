    technical: false
    evidence:
      - "Registo da classificação dos ativos de acordo com a sua criticidade e valor."
    questions:
      - id: ID.GA-5-B-Q1
        text: "Os ativos estão classificados pela sua importância (criticidade) e valor para a empresa?"
        explanation: "Os ativos mais importantes merecem mais proteção do que os restantes."
        example: "O servidor de faturação está marcado como crítico e a impressora da receção como pouco importante."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.GA-6-E
