        text: "O inventário de ativos inclui os serviços prestados por fornecedores de que a empresa depende?"
        explanation: "Serviços externos, como o alojamento do site ou o email na nuvem, também são ativos a proteger."
        example: "O inventário inclui o serviço de email na nuvem e o fornecedor de internet, além dos equipamentos."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.GA-5-B
    title: "Classificar os ativos pela importância"
