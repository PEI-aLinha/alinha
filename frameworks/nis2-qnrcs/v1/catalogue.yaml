        text: "A empresa usa uma ferramenta informática de gestão do inventário de software e aplicações?"
        explanation: "Uma ferramenta mostra que programas estão instalados em cada máquina sem ter de os contar à mão."
        example: "Um sistema que lista os programas instalados em todos os computadores e avisa quando aparece um novo."
