    controls: [GR.PP-2-B, ID.MC-3-B, ID.MC-3-S, PR.SP-2-B, PR.SP-2-S, PR.SP-2-E, DE.AE-1-S, DE.AE-1-E, DE.AE-2-B, DE.AE-2-E, DE.AE-4-S, DE.AE-6-B, RS.GI-1-B, RS.GI-1-S, RS.GI-2-S, RS.GI-3-S, RS.GI-3-E, RS.GI-5-S, RS.AI-1-E, RS.AI-2-E, RS.AI-3-E, RS.AI-4-E, RS.NC-1-B, RS.NC-1-S, RS.MI-1-S, RS.MI-2-E]
  - id: RJC-27-1-b
    reference: "DL 125/2025, art. 27.º, n.º 1, al. b)"
    text: "Continuidade das atividades, como a gestão de cópias de segurança e a recuperação de desastres, e gestão de crises"
    controls: [GR.CO-5-B, GR.CO-5-S, GR.CO-5-E, GR.PP-3-S, PR.SD-5-B, PR.SD-5-S, PR.SD-5-E, PR.RI-4-S, RC.PR-1-B, RC.PR-3-B, RC.PR-5-S, RC.PR-6-S, RC.CO-1-S, RC.CO-2-S, RC.CO-2-E]
  - id: RJC-27-1-c
