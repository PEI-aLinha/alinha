    questions:
      - id: ID.MC-3-S-Q1
        text: "As melhorias que resultam da monitorização e avaliação periódica das medidas de cibersegurança entram nos planos da empresa?"
        explanation: "Avaliar com regularidade as medidas mostra o que melhorar, e essas melhorias devem ficar planeadas."
        example: "A revisão semestral das medidas leva a acrescentar ao plano a mudança das palavras-passe de administração."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-1-B
    title: "Gerir contas e palavras-passe"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica da gestão de identidades e respetivas credenciais de dispositivos, serviços e utilizadores."
      - "Política de Gestão de Identidades, Autenticação e Controlo de Acessos aprovada e implementada."
      - "Política de Palavra-passe aprovada e implementada."
    questions:
      - id: PR.GA-1-B-Q1
        text: "As contas e credenciais de pessoas, equipamentos e serviços são geridas (criadas, alteradas e desativadas de forma controlada)?"
        explanation: "Cada acesso aos sistemas deve ter um dono conhecido, e as contas que já não são precisas devem ser desativadas."
        example: "Uma lista das contas de cada sistema, revista quando alguém entra ou sai da empresa."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-1-B-Q2
        text: "A empresa tem uma Política de Palavra-passe e uma Política de Gestão de Identidades, Autenticação e Controlo de Acessos em prática?"
        explanation: "Estas políticas dizem como devem ser as palavras-passe e quem pode aceder a quê."
        example: "As palavras-passe têm pelo menos 12 caracteres e só a contabilidade acede ao programa de salários."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-1-S
    title: "Contas inativas e uso estranho de credenciais"
    level: substantial
    technical: true
    evidence:
      - "Evidência técnica da desativação de credenciais dos sistemas, após o período específico de inatividade definido de acordo com a Política de Gestão de Identidades, Autenticação e Controlo de Acessos."
      - "Registo da monitorização contínua dos sistemas críticos quanto à utilização atípica de credenciais dos sistemas."
    questions:
      - id: PR.GA-1-S-Q1
        text: "As contas sem utilização durante o período definido na política de acessos são desativadas?"
        explanation: "Contas esquecidas são uma porta de entrada fácil para atacantes."
        example: "Uma conta sem utilização há 90 dias é desativada, salvo se isso parar um processo crítico."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-1-S-Q2
        text: "Os sistemas críticos são vigiados para detetar uso estranho de credenciais?"
        explanation: "Um uso fora do habitual pode indicar que uma palavra-passe foi roubada."
        example: "Um alerta quando a mesma conta entra a partir de dois países no mesmo dia."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-1-E
    title: "Gestão automática de credenciais e autenticação entre sistemas"
    level: high
    technical: true
    evidence:
      - "Evidência técnica de mecanismos automatizados de suporte à gestão de identidades e credenciais dos dispositivos, serviços e utilizadores."
      - "Evidência técnica da aplicação de autenticação segura nas transações entre sistemas críticos."
    questions:
      - id: PR.GA-1-E-Q1
        text: "As contas e credenciais de pessoas, equipamentos e serviços são geridas por meios automáticos?"
        explanation: "Meios automáticos criam e retiram acessos sem esquecimentos nem atrasos."
        example: "Quando alguém sai da empresa, o sistema de recursos humanos desativa automaticamente todas as suas contas."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-1-E-Q2
        text: "A comunicação entre sistemas críticos usa autenticação segura (dois fatores, certificados ou chaves criptográficas)?"
        explanation: "Os sistemas também se devem identificar uns aos outros de forma segura, e não só as pessoas."
        example: "O servidor de faturação só aceita ligações do servidor de base de dados que apresente um certificado válido."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-2-S
    title: "Confirmar a identidade antes de dar acesso"
    level: substantial
    technical: false
    evidence:
      - "Registo da implementação de procedimentos de verificação da identidade dos utilizadores, antes da emissão de credenciais."
    questions:
      - id: PR.GA-2-S-Q1
        text: "A empresa confirma a identidade de cada pessoa antes de lhe dar acesso aos sistemas, como diz a política de acessos?"
        explanation: "Assim evita-se dar acesso a alguém que se faz passar por outra pessoa."
        example: "A conta de um novo colaborador só é criada depois de os recursos humanos confirmarem o contrato e o documento de identificação."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-2-E
    title: "Credenciais únicas para sistemas críticos"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da atribuição de credenciais únicas para cada utilizador, dispositivo ou processo que interaja com sistemas críticos da entidade."
      - "Registo documentado das exceções à Política de Gestão de Identidades, Autenticação e Controlo de Acessos e a sua respetiva aprovação."
    questions:
      - id: PR.GA-2-E-Q1
        text: "Cada pessoa, equipamento e processo que acede aos sistemas críticos tem as suas próprias credenciais, sem contas partilhadas?"
        explanation: "Com contas individuais sabe-se sempre quem fez o quê."
        example: "Cada técnico tem a sua conta de administrador, em vez de todos usarem a mesma conta 'admin'."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-2-E-Q2
        text: "As exceções a esta regra estão documentadas e aprovadas?"
        explanation: "Quando uma conta partilhada é inevitável, isso deve ficar registado e autorizado."
        example: "Uma conta de serviço partilhada por um equipamento industrial, registada e aprovada pelo responsável."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-3-B
    title: "Dois fatores no acesso remoto e de administração"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica da implementação de autenticação multifator (MFA) nos acessos remotos e contas privilegiadas."
    questions:
      - id: PR.GA-3-B-Q1
        text: "Os acessos remotos e as contas de administração pedem um segundo fator, além da palavra-passe?"
        explanation: "Além da palavra-passe, a pessoa confirma quem é com outra coisa, como um código no telemóvel."
        example: "Para entrar na VPN a partir de casa, é preciso a palavra-passe e um código numa aplicação do telemóvel."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-3-S
    title: "Autenticação adequada ao risco e dois fatores nos sistemas críticos"
    level: substantial
    technical: true
    evidence:
      - "Registo da avaliação do risco das comunicações entre sistemas críticos."
      - "Evidência técnica dos mecanismos de autenticação aplicados aos utilizadores, dispositivos e outros ativos."
      - "Evidência técnica da implementação de autenticação multifator (MFA) nos sistemas críticos."
    questions:
      - id: PR.GA-3-S-Q1
        text: "A empresa avaliou o risco das comunicações entre os seus sistemas críticos e aplica uma autenticação adequada a esse risco?"
        explanation: "Quanto mais importante o sistema, mais forte deve ser a forma de confirmar quem lhe acede."
        example: "Uma análise que levou a exigir certificados nas ligações entre o servidor de produção e o de base de dados."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-3-S-Q2
        text: "Os sistemas críticos pedem dois fatores de autenticação a quem lhes acede?"
        explanation: "Nos sistemas mais importantes, a palavra-passe sozinha não chega."
        example: "Para entrar no programa de gestão, é preciso a palavra-passe e um código no telemóvel."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-3-E
    title: "Acordos com sistemas externos e dois fatores em tudo"
    level: high
    technical: true
    evidence:
      - "Modelos de acordos entre a entidade e terceiros para comunicação entre sistemas."
      - "Evidência técnica da implementação de autenticação multifator (MFA) em todos os seus dispositivos e outros ativos de sistemas de informação, quando possível."
    questions:
      - id: PR.GA-3-E-Q1
        text: "As ligações entre os sistemas da empresa e sistemas externos (parceiros, fornecedores, nuvem) estão definidas num acordo?"
        explanation: "O acordo diz que dados passam, como e com que proteções."
        example: "Um acordo com o fornecedor de serviços na nuvem que define como os sistemas trocam dados."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-3-E-Q2
        text: "Todos os equipamentos e sistemas que o permitem pedem dois fatores de autenticação?"
        explanation: "Neste nível, os dois fatores deixam de ser só para os sistemas críticos."
        example: "Os computadores, o email e as aplicações pedem um código no telemóvel além da palavra-passe."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-4-E
    title: "Proteger as confirmações de identidade"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da proteção, transmissão e verificação das afirmações de identidade."
    questions:
      - id: PR.GA-4-E-Q1
        text: "As confirmações de identidade trocadas entre sistemas são protegidas, transmitidas de forma segura e verificadas?"
        explanation: "Quando um sistema diz a outro quem é o utilizador, essa informação não pode ser falsificada nem intercetada."
        example: "O sistema de entrada única (single sign-on) assina digitalmente cada confirmação, e as aplicações verificam a assinatura."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-5-B
    title: "Dar só os acessos necessários"
    level: basic
    technical: true
    evidence:
      - "Registo documentado da definição e evidência técnica da gestão de acessos dos utilizadores aos sistemas da entidade em conformidade com a Política de Gestão de Identidades, Autenticação e Controlo de Acessos."
      - "Inclusão na Política de Gestão de Identidades, Autenticação e Controlo de Acessos de critérios que garantam a aplicação do princípio do menor privilégio."
      - "Registo documentado dos utilizadores com privilégios de administração atribuídos e respetiva aprovação."
    questions:
      - id: PR.GA-5-B-Q1
        text: "As permissões de cada pessoa são definidas segundo a política de acessos e revistas periodicamente?"
        explanation: "Com o tempo, as pessoas acumulam acessos de que já não precisam."
        example: "Duas vezes por ano, cada chefe confirma os acessos da sua equipa."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-5-B-Q2
        text: "O acesso a dados e sistemas críticos segue o princípio do menor privilégio (cada pessoa só acede ao que precisa)?"
        explanation: "Quanto menos acessos cada pessoa tiver, menos estragos faz uma conta roubada."
        example: "Os comerciais acedem à lista de clientes, mas não aos salários."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-5-B-Q3
        text: "As contas novas são criadas sem privilégios de administração?"
        explanation: "Os privilégios de administração só devem ser dados a quem precisa, quando precisa."
        example: "Os colaboradores usam contas normais e só o técnico tem uma conta de administrador separada."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-5-S
    title: "Gerir acessos e separar funções"
    level: substantial
    technical: true
    evidence:
      - "Evidência técnica da implementação de mecanismos para apoiar a gestão do ciclo de vida dos acessos aos sistemas críticos."
      - "Registo da segregação de perfis de administração de ativos críticos em função da lista de papéis, funções e responsabilidades."
      - "Registo documentado da atribuição de privilégios elevados a utilizadores."
    questions:
      - id: PR.GA-5-S-Q1
        text: "A empresa tem meios para desativar, vigiar, comunicar e apagar as contas dos sistemas críticos?"
        explanation: "Estes meios garantem que as contas dos sistemas críticos estão sempre sob controlo."
        example: "Uma consola central onde se veem e desativam as contas de todos os sistemas críticos."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-5-S-Q2
        text: "As permissões respeitam a separação de funções (a mesma pessoa não controla sozinha todo um processo sensível)?"
        explanation: "Separar funções evita que uma única pessoa cometa ou esconda um erro ou uma fraude."
        example: "Quem cria um pagamento não é a mesma pessoa que o aprova."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-5-S-Q3
        text: "As contas com privilégios elevados são geridas, documentadas e revistas regularmente?"
        explanation: "As contas de administrador são as mais perigosas se forem roubadas."
        example: "Uma lista das contas de administrador, revista todos os trimestres."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-5-E
    title: "Vigiar acessos fora do habitual e contas privilegiadas"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da aplicação de restrições e monitorização ativa do contexto em que ocorre a autenticação de utilizadores. Evidência técnica da monitorização das atividades realizadas por utilizadores com privilégios elevados."
    questions:
      - id: PR.GA-5-E-Q1
        text: "A empresa vigia o contexto dos acessos e deteta entradas a partir de equipamentos, locais ou horários fora do habitual?"
        explanation: "Um acesso a uma hora ou de um local estranho pode indicar que uma conta foi roubada."
        example: "Um alerta quando alguém entra no sistema às 3 da manhã a partir de outro país."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-5-E-Q2
        text: "As ações feitas com contas de privilégios elevados são vigiadas?"
        explanation: "O que um administrador faz pode mudar tudo, por isso deve ficar registado e ser vigiado."
        example: "Todas as ações das contas de administrador ficam registadas e são revistas semanalmente."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-6-B
    title: "Zonas de acesso restrito"
    level: basic
    technical: false
    evidence:
      - "Evidência da definição das zonas de acesso restrito."
      - "Evidência da aplicação de medidas para proteção das zonas de acesso restrito."
    questions:
      - id: PR.GA-6-B-Q1
        text: "A empresa definiu as zonas onde estão a informação confidencial, a rede ou os sistemas, e protege o acesso físico a elas?"
        explanation: "Quem entra fisicamente na sala dos servidores pode copiar ou estragar a informação."
        example: "A sala dos servidores está fechada à chave e só o responsável de informática tem a chave."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-6-S
    title: "Vigiar o acesso físico e prever emergências"
    level: substantial
    technical: false
    evidence:
      - "Registo da monitorização do acesso físico a zonas de acesso restrito."
      - "Registo da definição de medidas para o acesso físico a zonas de acesso restrito a aplicar em situações de emergência."
    questions:
      - id: PR.GA-6-S-Q1
        text: "O acesso físico às zonas restritas é vigiado e registado?"
        explanation: "Registar quem entra permite saber quem esteve na sala se algo acontecer."
        example: "Um cartão de acesso que regista cada entrada na sala dos servidores."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-6-S-Q2
        text: "O acesso às zonas restritas tem medidas previstas para situações de emergência?"
        explanation: "Numa emergência, como um incêndio, é preciso entrar ou sair sem pôr a segurança em causa."
        example: "Um procedimento que diz quem pode abrir a sala dos servidores numa emergência e como fica registado."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-6-E
    title: "Proteção física dos equipamentos"
    level: high
    technical: false
    evidence:
      - "Evidência técnica da implementação de proteções físicas aos ativos alojados nas zonas críticas."
    questions:
      - id: PR.GA-6-E-Q1
        text: "Os equipamentos que estão nas zonas restritas têm proteção física própria?"
        explanation: "Além da porta da sala, os próprios equipamentos devem estar protegidos."
        example: "Os servidores estão num armário fechado à chave dentro da sala."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-7-B
    title: "Controlar o acesso remoto"
    level: basic
    technical: true
    evidence:
      - "Registo documentado dos utilizadores e dispositivos autorizados a aceder remotamente a redes e sistemas da entidade."
      - "Evidência técnica da implementação de controlos de segurança para proteção adequada de ligações remotas aos sistemas da entidade."
    questions:
      - id: PR.GA-7-B-Q1
        text: "A empresa tem uma lista das pessoas e equipamentos autorizados a aceder remotamente às suas redes e sistemas?"
        explanation: "Só quem está na lista deve conseguir entrar a partir de fora."
        example: "Uma lista com os colaboradores em teletrabalho e o técnico externo que pode aceder por VPN."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-7-B-Q2
        text: "Os acessos remotos estão protegidos com medidas de segurança adequadas?"
        explanation: "Um acesso remoto mal protegido é das formas mais comuns de os atacantes entrarem."
        example: "O acesso remoto é feito por VPN com dois fatores, e não abrindo o computador diretamente à internet."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-7-S
    title: "Regras do acesso remoto e manutenção remota"
    level: substantial
    technical: true
    evidence:
      - "Evidencia técnica da implementação de medidas de segurança para garantir que os acessos remotos ao ambiente dos sistemas críticos da entidade cumprem as restrições de utilização, os requisitos de ligação e as autorizações definidas."
      - "Evidencia técnica da monitorização das manutenções remotas, e dos acessos autorizados, atribuídos, e revogados após a conclusão da manutenção."
    questions:
      - id: PR.GA-7-S-Q1
        text: "Estão definidas e aplicadas as regras, requisitos de ligação e autorizações para o acesso remoto aos sistemas críticos?"
        explanation: "As regras dizem quem pode entrar remotamente, a que sistemas e em que condições."
        example: "Só o técnico de manutenção pode aceder remotamente ao servidor de produção, e apenas a partir de um computador da empresa."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-7-S-Q2
        text: "O que é feito nas manutenções remotas é vigiado?"
        explanation: "Assim deteta-se se alguém faz algo que põe em causa a segurança durante a manutenção."
        example: "As sessões de manutenção remota do fornecedor ficam gravadas e são revistas."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.GA-7-S-Q3
        text: "Os acessos dados para manutenções remotas são retirados logo que deixam de ser necessários?"
        explanation: "Um acesso de manutenção esquecido pode ser usado mais tarde por um atacante."
        example: "O acesso do fornecedor é ativado só no dia da manutenção e desativado no fim."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.GA-7-E
    title: "Acesso remoto vigiado e por canais seguros"
    level: high
    technical: true
    evidence:
      - "Evidencia técnica da implementação de canais seguros para acesso remoto (incluindo ações de manutenção)."
      - "Evidência técnica da recolha e análise dos registos de atividades dos utilizadores em formato remoto aquando do seu acesso aos sistemas críticos da entidade."
    questions:
      - id: PR.GA-7-E-Q1
        text: "O acesso remoto aos sistemas críticos é vigiado e feito por canais seguros, com encriptação forte e protocolos aprovados, incluindo na manutenção remota?"
        explanation: "A encriptação impede que alguém leia ou altere a comunicação pelo caminho."
        example: "Todos os acessos remotos passam por uma VPN com encriptação forte e ficam registados."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.FC-1-B
    title: "Sensibilização de todos para a cibersegurança"
    level: basic
    technical: false
    evidence:
      - "Registo documentado da participação do pessoal em ações de sensibilização em matéria de cibersegurança."
    questions:
      - id: PR.FC-1-B-Q1
        text: "Todas as pessoas da empresa participam periodicamente em ações de sensibilização sobre cibersegurança?"
        explanation: "Muitos ataques começam com um email falso; pessoas atentas são a primeira defesa."
        example: "Uma sessão anual sobre emails falsos e palavras-passe, com registo de presenças."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.FC-1-S
    title: "Formação sobre incidentes e ameaças internas"
    level: substantial
    technical: false
    evidence:
      - "Registo documentado da participação periódica do pessoal em ações de formação em matérias de cibersegurança."
    questions:
      - id: PR.FC-1-S-Q1
        text: "As pessoas têm formação periódica sobre o que lhes cabe fazer durante um incidente de cibersegurança?"
        explanation: "Num incidente, cada pessoa deve saber o que fazer e a quem avisar."
        example: "Uma formação que explica que, ao ver um ecrã de resgate, se desliga o computador da rede e se avisa o responsável."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.FC-1-S-Q2
        text: "A formação inclui a forma de reconhecer e comunicar ameaças internas?"
        explanation: "As ameaças também podem vir de dentro, por exemplo de alguém que copia dados antes de sair."
        example: "Uma sessão que explica a que sinais estar atento e como comunicar uma suspeita de forma confidencial."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.FC-1-E
    title: "Medir a eficácia da formação"
    level: high
    technical: false
    evidence:
      - "Registo da definição dos indicadores para avaliar a eficácia das ações de sensibilização e formação, e recolha dos resultados dos mesmos com a respetiva integração em processos de melhoria continua."
    questions:
      - id: PR.FC-1-E-Q1
        text: "A empresa usa indicadores para medir se a sensibilização e a formação funcionam, e usa os resultados para melhorar?"
        explanation: "Medir mostra se as pessoas aprenderam e o que é preciso reforçar."
        example: "Uma campanha de email falso a cada semestre, para medir quantas pessoas clicam, e mais formação para essas pessoas."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.FC-2-B
    title: "Formação da gerência"
    level: basic
    technical: false
    evidence:
      - "Registo documentado da participação periódica dos membros dos órgãos de gestão, direção e administração em ações de formação em matéria de cibersegurança."
    questions:
      - id: PR.FC-2-B-Q1
        text: "Os membros da gerência ou administração fazem formação periódica em cibersegurança?"
        explanation: "A gerência decide os recursos e responde pela cibersegurança, por isso tem de a compreender."
        example: "A administração faz todos os anos uma formação sobre as obrigações do Regime Jurídico da Cibersegurança."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.FC-2-S
    title: "Plano de formação para os especialistas"
    level: substantial
    technical: false
    evidence:
      - "Registo documentado da definição do Plano de sensibilização e formação para pessoal com funções especializadas em cibersegurança, e da respetiva execução do mesmo."
    questions:
      - id: PR.FC-2-S-Q1
        text: "Existe um plano de formação em cibersegurança, atualizado periodicamente, para as pessoas com funções especializadas nesta área?"
        explanation: "Quem trata da cibersegurança precisa de formação contínua para acompanhar novas ameaças."
        example: "Um plano anual com os cursos que o técnico de segurança vai fazer."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SD-1-S
    title: "Integridade dos dados guardados e dispositivos amovíveis"
    level: substantial
    technical: true
    evidence:
      - "Evidência técnica da implementação de controlos de verificação da integridade da informação do software e firmware."
      - "Evidência técnica da configuração da restrição da utilização de suportes de armazenamento amovíveis."
    questions:
      - id: PR.SD-1-S-Q1
        text: "A empresa verifica a integridade da informação, do software e do firmware para detetar alterações não autorizadas?"
        explanation: "Assim deteta-se se alguém alterou dados ou programas sem autorização."
        example: "Uma ferramenta que avisa quando um ficheiro de configuração do servidor é alterado."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SD-1-S-Q2
        text: "O uso de dispositivos amovíveis (como pens USB) é limitado, como diz a Política de Uso Aceitável?"
        explanation: "As pens USB podem trazer vírus ou levar dados para fora da empresa."
        example: "Os computadores só aceitam pens USB autorizadas pela empresa."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SD-1-E
    title: "Encriptar a informação sensível guardada"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da implementação de controlos de segurança, e de mecanismos criptográficos, para proteção da informação armazenada nos sistemas críticos e que seja considerada crítica/sensível."
    questions:
      - id: PR.SD-1-E-Q1
        text: "A informação crítica ou sensível dos sistemas críticos está encriptada quando guardada?"
        explanation: "Encriptar torna os dados ilegíveis para quem os roube sem a chave."
        example: "Os discos dos servidores e dos portáteis estão encriptados."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SD-2-B
    title: "Encriptar o acesso a informação sensível"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica da implementação de mecanismos criptográficos para os dados em trânsito."
    questions:
      - id: PR.SD-2-B-Q1
        text: "O acesso a dados e informação crítica ou sensível é feito com encriptação?"
        explanation: "Sem encriptação, quem estiver na mesma rede pode ler os dados que passam."
        example: "O programa de gestão só se abre por HTTPS e o email usa ligações encriptadas."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SD-2-E
    title: "Proteger toda a informação que sai da empresa"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da implementação dos controlos de segurança para proteção dos dados em trânsito, de acordo com a classificação, e em conformidade com a Política de Classificação e Gestão de Dados, inclusive nos fluxos de dados e interfaces de comunicação para o exterior."
    questions:
      - id: PR.SD-2-E-Q1
        text: "Todos os fluxos de dados e ligações para o exterior, incluindo dispositivos amovíveis, estão protegidos conforme a classificação da informação, com as exceções registadas?"
        explanation: "A informação deve estar protegida sempre que sai da empresa, seja pela internet ou numa pen USB."
        example: "Os ficheiros confidenciais enviados a clientes vão encriptados, e as pens USB da empresa também são encriptadas."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SD-3-E
    title: "Impedir a saída indevida de dados"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da implementação de controlos de segurança adequados para monitorizar os sistemas críticos nas fronteiras externas e nos pontos críticos internos, para evitar acessos e atividades não autorizadas, incluindo exfiltração de dados."
    questions:
      - id: PR.SD-3-E-Q1
        text: "Os sistemas críticos são vigiados nas ligações ao exterior e nos pontos internos mais importantes para impedir acessos indevidos e a saída de dados?"
        explanation: "Um atacante que entra tenta muitas vezes copiar dados para fora sem ser notado."
        example: "Uma ferramenta que alerta quando sai uma quantidade de dados fora do normal para a internet."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SD-4-E
    title: "Proteção contra ataques de negação de serviço"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da implementação de controlos de segurança para proteger os sistemas críticos ou limitar o impacto de ataques de negação de serviço."
    questions:
      - id: PR.SD-4-E-Q1
        text: "Os sistemas críticos estão protegidos contra ataques de negação de serviço, ou o seu impacto está limitado?"
        explanation: "Um ataque de negação de serviço enche um sistema de pedidos falsos até ele deixar de responder."
        example: "O site e a loja online estão atrás de um serviço de proteção que filtra o tráfego de ataque."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SD-5-B
    title: "Cópias de segurança"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica da execução regular de cópias de segurança, e armazenamento num sistema distinto do dispositivo no qual os dados originais estão alojados."
    questions:
      - id: PR.SD-5-B-Q1
        text: "A empresa faz cópias de segurança regulares dos dados críticos?"
        explanation: "As cópias de segurança permitem recuperar os dados depois de uma avaria ou de um ataque."
        example: "Uma cópia diária automática da base de dados de faturação."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SD-5-B-Q2
        text: "As cópias de segurança ficam guardadas num sistema diferente do equipamento onde estão os dados originais?"
        explanation: "Se a cópia estiver no mesmo equipamento, perde-se junto com os dados originais."
        example: "A cópia do servidor fica num disco externo noutro edifício ou num serviço na nuvem."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SD-5-S
    title: "Política de cópias de segurança e testes de recuperação"
    level: substantial
    technical: true
    evidence:
      - "Política de Cópias de Segurança aprovada e implementada."
      - "Evidência técnica da verificação e de testes regulares, de acordo com a periodicidade definida na Política de Cópias de Segurança, da integridade das cópias de segurança."
      - "Evidência técnica da implementação de um esquema de redundância das cópias de segurança, e seu armazenamento em local distinto e protegido."
    questions:
      - id: PR.SD-5-S-Q1
        text: "A empresa tem uma Política de Cópias de Segurança aprovada, com regras formais para fazer as cópias?"
        explanation: "A política diz o que se copia, com que frequência e onde se guarda."
        example: "Uma política que diz que a faturação é copiada todos os dias e guardada durante um ano."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SD-5-S-Q2
        text: "A disponibilidade e a integridade das cópias são testadas regularmente, de forma independente do sistema protegido?"
        explanation: "Uma cópia que nunca foi testada pode não servir quando for precisa."
        example: "Uma vez por mês, recupera-se uma cópia num computador à parte para confirmar que os dados estão completos."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SD-5-S-Q3
        text: "Existe um esquema de redundância para as cópias de segurança (mais do que uma cópia de cada conjunto de dados)?"
        explanation: "Se a única cópia falhar, perde-se tudo; com várias cópias isso não acontece."
        example: "Cada cópia diária é feita em dois suportes diferentes."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SD-5-S-Q4
        text: "As cópias de segurança estão guardadas em locais diferentes, todos com a mesma proteção?"
        explanation: "Guardar as cópias em sítios diferentes evita perder tudo num único incidente, como um incêndio."
        example: "Uma cópia num disco no escritório e outra num serviço na nuvem, ambas encriptadas."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SD-5-E
    title: "Cópias alinhadas com os planos e separadas por tipo"
    level: high
    technical: true
    evidence:
      - "Registo de um processo de verificação das cópias de segurança em conformidade com os restantes procedimentos, planos e políticas da entidade."
      - "Evidência técnica do armazenamento em locais separados, das cópias de segurança dos sistemas críticos e das informações críticas."
    questions:
      - id: PR.SD-5-E-Q1
        text: "A verificação das cópias de segurança está alinhada com os outros planos de cibersegurança, como o de continuidade e o de resposta a incidentes?"
        explanation: "As cópias são a base para recuperar num incidente, por isso têm de corresponder ao que os planos preveem."
        example: "O plano de continuidade prevê recuperar a faturação em 4 horas, e os testes às cópias confirmam que é possível."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SD-5-E-Q2
        text: "As cópias dos sistemas críticos (sistemas operativos, configurações, aplicações) estão separadas das cópias da informação crítica?"
        explanation: "Separar as cópias permite recuperar os sistemas e os dados de forma independente."
        example: "As imagens dos servidores ficam num local e as cópias da base de dados noutro."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SP-1-B
    title: "Configuração base segura"
    level: basic
    technical: true
    evidence:
      - "Registo da configuração base aplicada nos diferentes sistemas e componentes de rede da entidade."
    questions:
      - id: PR.SP-1-B-Q1
        text: "A empresa mantém uma configuração base para as redes e sistemas que inclui princípios de segurança?"
        explanation: "Uma configuração base é o ponto de partida seguro usado sempre que se instala um sistema."
        example: "Todos os computadores novos são instalados com a mesma configuração: antivírus, firewall ativa e sem contas de fábrica."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SP-1-S
    title: "Configuração base documentada"
    level: substantial
    technical: true
    evidence:
      - "Evidencia técnica das configurações base de segurança das redes e sistemas de informação."
    questions:
      - id: PR.SP-1-S-Q1
        text: "A configuração base de segurança das redes e sistemas está documentada e atualizada?"
        explanation: "Documentar a configuração permite repô-la e verificar se algo foi alterado."
        example: "Um documento com as definições de segurança do servidor e do router, revisto a cada mudança."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SP-1-E
    title: "Só o essencial ligado"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da aplicação do princípio da funcionalidade mínima e desativação de todos os protocolos, portos e serviços desnecessários, aquando da configuração das redes e sistemas da entidade."
      - "Evidência técnica da implementação de controlos alinhados com os princípios de segurança de “denyall” e “permit by exception”."
    questions:
      - id: PR.SP-1-E-Q1
        text: "Os sistemas críticos têm apenas as funcionalidades necessárias, com os protocolos, portos e serviços desnecessários desligados?"
        explanation: "Cada serviço ligado sem necessidade é mais uma porta que um atacante pode usar."
        example: "No servidor de faturação só está ligado o serviço de faturação; a partilha de ficheiros foi desativada."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SP-1-E-Q2
        text: "Os controlos de segurança seguem a regra de bloquear tudo e só permitir o que for autorizado?"
        explanation: "É mais seguro bloquear tudo e abrir só o necessário do que permitir tudo e bloquear o que se lembra."
        example: "A firewall bloqueia todo o tráfego, exceto as ligações autorizadas uma a uma."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SP-2-B
    title: "Registos de atividade (logs)"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica da recolha, armazenamento e análise regular dos logs dos sistemas da entidade."
    questions:
      - id: PR.SP-2-B-Q1
        text: "Os registos de atividade (logs) dos equipamentos e sistemas são recolhidos, guardados, protegidos e revistos regularmente?"
        explanation: "Os logs mostram o que aconteceu nos sistemas e são essenciais para investigar um incidente."
        example: "Os logs do servidor e da firewall são guardados num local central e revistos todas as semanas."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SP-2-B-Q2
        text: "O tempo que os logs são guardados foi definido com base no risco de cada sistema?"
        explanation: "Os sistemas mais importantes justificam guardar os registos durante mais tempo."
        example: "Os logs dos sistemas críticos são guardados durante um ano e os restantes durante três meses."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SP-2-S
    title: "Relógio sincronizado nos registos"
    level: substantial
    technical: true
    evidence:
      - "Evidencia técnica da sincronização temporal dos logs dos ativos."
    questions:
      - id: PR.SP-2-S-Q1
        text: "Os registos de atividade usam um relógio interno sincronizado com uma fonte oficial de hora?"
        explanation: "Com a hora certa em todos os sistemas, é possível reconstruir a sequência de um incidente."
        example: "Todos os servidores acertam a hora pelo mesmo servidor interno, que segue a hora oficial."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SP-2-E
    title: "Alertas, capacidade e isolamento dos registos"
    level: high
    technical: true
    evidence:
      - "Evidência técnica de alarmística para situações de falha de processamento de logs."
      - "Evidência técnica do armazenamento de logs gerados por sistemas críticos em sistema autónomo."
    questions:
      - id: PR.SP-2-E-Q1
        text: "As falhas no processamento dos registos geram alertas?"
        explanation: "Se os registos deixarem de ser recolhidos sem ninguém saber, perde-se a informação quando ela for precisa."
        example: "Um alerta por email quando o servidor de logs deixa de receber registos de um sistema."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SP-2-E-Q2
        text: "A capacidade de guardar registos é revista periodicamente e aumentada quando necessário?"
        explanation: "Sem espaço suficiente, os registos mais antigos são apagados antes do tempo."
        example: "Uma revisão semestral do espaço ocupado pelos logs, com compra de mais espaço quando falta."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SP-2-E-Q3
        text: "Os registos dos sistemas críticos ficam guardados num sistema autónomo, separado desses sistemas?"
        explanation: "Um atacante que entre num sistema tenta apagar os registos para esconder o que fez."
        example: "Os logs são enviados para um servidor próprio a que só a equipa de segurança acede."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SP-3-B
    title: "Bloquear programas não autorizados e filtrar tráfego"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica de configuração implementada para impedir a instalação e execução de software não autorizado."
      - "Evidência técnica da implementação de tecnologias de filtro de rede, e-mail e web."
    questions:
      - id: PR.SP-3-B-Q1
        text: "A empresa impede a instalação e a execução de programas não autorizados?"
        explanation: "Programas não autorizados podem trazer vírus ou abrir portas a atacantes."
        example: "Os colaboradores não têm permissões para instalar programas; os pedidos passam pelo técnico."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SP-3-B-Q2
        text: "A empresa usa filtros de rede, de email e de navegação na internet?"
        explanation: "Os filtros bloqueiam emails falsos, anexos perigosos e sites maliciosos antes de chegarem às pessoas."
        example: "Um filtro de email que bloqueia anexos executáveis e um filtro web que bloqueia sites de risco."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SP-4-S
    title: "Segurança no desenvolvimento de software"
    level: substantial
    technical: true
    evidence:
      - "Evidência técnica da aplicação dos princípios de segurança aplicadas ao ciclo de vida de desenvolvimento de sistemas e aplicações."
      - "Registos da gestão de alterações aplicável ao desenvolvimento de software."
    questions:
      - id: PR.SP-4-S-Q1
        text: "O desenvolvimento de sistemas e aplicações segue os princípios de segurança desde a conceção e segurança por defeito?"
        explanation: "Pensar na segurança desde o início sai mais barato e é mais eficaz do que corrigir no fim. Se a empresa não desenvolve software, responda 'sim'."
        example: "Cada nova funcionalidade da aplicação começa com uma análise do que pode correr mal em termos de segurança."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.SP-4-S-Q2
        text: "Alterações e exceções no desenvolvimento têm uma análise de impacto na segurança, num ambiente de teste separado, antes de chegar à produção?"
        explanation: "Testar à parte evita que uma alteração com falhas chegue aos clientes."
        example: "Uma alteração à loja online é testada num servidor de testes, com verificação de segurança, antes de ser publicada."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.SP-4-E
    title: "Práticas de desenvolvimento seguro acompanhadas"
    level: high
    technical: true
    evidence:
      - "Registo dos testes de qualidade de software, respetivas conclusões e acompanhamento da devida integração dos critérios de segurança definidos."
    questions:
      - id: PR.SP-4-E-Q1
        text: "As práticas de desenvolvimento seguro estão integradas em todo o ciclo de desenvolvimento e o seu desempenho é acompanhado?"
        explanation: "Não basta ter regras: é preciso confirmar que são seguidas e que resultam. Se a empresa não desenvolve software, responda 'sim'."
        example: "Cada versão passa por uma análise automática de vulnerabilidades no código, e os resultados são acompanhados mensalmente."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.RI-1-B
    title: "Firewalls, segmentação e redes sem fios"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica da instalação e ativação de firewalls em todas as redes da entidade."
      - "Evidência técnica da segmentação e segregação das redes."
      - "Evidência técnica da configuração segura dos pontos de acesso a redes sem fio da entidade, da sua gestão e monitorização."
    questions:
      - id: PR.RI-1-B-Q1
        text: "Todas as redes da empresa têm firewalls instaladas, configuradas e com as regras atualizadas?"
        explanation: "A firewall controla o que pode entrar e sair da rede."
        example: "O router tem a firewall ativa e as regras são revistas sempre que se abre ou fecha um serviço."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.RI-1-B-Q2
        text: "A rede dos sistemas críticos está separada (segmentada) do resto da rede?"
        explanation: "Separar a rede impede que um problema num computador de escritório chegue aos sistemas críticos."
        example: "Os servidores e as máquinas de produção estão numa rede separada da rede dos computadores e dos convidados."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.RI-1-B-Q3
        text: "As redes sem fios (Wi-Fi) estão configuradas de forma segura, geridas e vigiadas?"
        explanation: "Um Wi-Fi mal protegido permite que alguém no exterior entre na rede da empresa."
        example: "O Wi-Fi da empresa usa WPA3 com palavra-passe forte, e os convidados usam uma rede à parte."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.RI-1-S
    title: "Controlar as ligações dos sistemas críticos"
    level: substantial
    technical: true
    evidence:
      - "Diagrama de redes da entidade com referência à sua segmentação dos sistemas críticos."
      - "Demonstração das configurações para bloqueio de ligações não autorizadas aos sistemas críticos."
      - "Evidência técnica da monitorização de rede das ligações e comunicações aos sistemas críticos."
    questions:
      - id: PR.RI-1-S-Q1
        text: "As ligações entre os componentes dos sistemas críticos estão identificadas, documentadas e controladas, e as ligações externas estão limitadas?"
        explanation: "Saber e limitar com quem os sistemas críticos falam reduz os caminhos que um atacante pode usar."
        example: "Um documento com as ligações do servidor de produção, que só pode falar com a base de dados e com o fornecedor."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.RI-1-S-Q2
        text: "As comunicações nas fronteiras externas e nas principais fronteiras internas dos sistemas críticos são vigiadas e controladas com equipamentos de proteção?"
        explanation: "Estes equipamentos detetam e bloqueiam tráfego suspeito à entrada e à saída dos sistemas críticos."
        example: "Uma firewall com deteção de intrusões entre a rede de escritório e a rede de produção."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.RI-1-E
    title: "Proxy, tolerância a falhas e fluxos de dados"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da implementação de servidores proxy para a comunicação entre os sistemas críticos e redes externas."
      - "Evidência técnica da implementação de controlos de segurança para a tolerância a falhas dos dispositivos e tecnologias de proteção."
      - "Evidência técnica da monitorização dos fluxos de dados dos sistemas críticos."
    questions:
      - id: PR.RI-1-E-Q1
        text: "O tráfego entre os sistemas críticos e as redes externas passa por servidores proxy com autenticação?"
        explanation: "Um proxy é um intermediário que controla e regista as ligações para fora."
        example: "Os servidores de produção só acedem à internet através de um proxy que pede autenticação."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.RI-1-E-Q2
        text: "Os equipamentos e tecnologias de proteção têm controlos de segurança e tolerância a falhas?"
        explanation: "Se a firewall avariar, a proteção não pode simplesmente desaparecer."
        example: "Duas firewalls em paralelo, em que a segunda assume se a primeira falhar."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.RI-1-E-Q3
        text: "A empresa controla os fluxos de dados dos seus sistemas críticos?"
        explanation: "Controlar os fluxos é saber e limitar que dados entram e saem dos sistemas críticos."
        example: "Regras que só deixam sair do servidor de produção os relatórios enviados ao cliente."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.RI-2-S
    title: "Separar desenvolvimento e testes da produção"
    level: substantial
    technical: true
    evidence:
      - "Evidência técnica da separação de ambientes de teste e de produção."
    questions:
      - id: PR.RI-2-S-Q1
        text: "Os ambientes de desenvolvimento e de teste estão separados do ambiente de produção?"
        explanation: "Testar em produção pode estragar dados reais ou parar o serviço. Se a empresa não desenvolve nem testa software, responda 'sim'."
        example: "As alterações à aplicação são testadas num servidor de testes, sem acesso aos dados reais dos clientes."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.RI-3-E
    title: "Proteção contra incêndios e testes ao ambiente físico"
    level: high
    technical: false
    evidence:
      - "Evidência técnica da implementação de dispositivos de deteção contra ameaças naturais e registo da realização periódica de testes."
    questions:
      - id: PR.RI-3-E-Q1
        text: "Existem detetores de incêndio que disparam e avisam automaticamente as pessoas indicadas?"
        explanation: "Um incêndio na sala dos servidores pode destruir os sistemas e os dados."
        example: "Um detetor de fumo na sala dos servidores que envia uma mensagem ao responsável."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.RI-3-E-Q2
        text: "A eficácia das proteções do ambiente físico é testada periodicamente?"
        explanation: "Detetores e outras proteções podem avariar sem ninguém dar por isso."
        example: "Um teste anual aos detetores de incêndio e ao sistema de alimentação de emergência."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.RI-4-S
    title: "Resiliência em situações adversas"
    level: substantial
    technical: true
    evidence:
      - "Evidência técnica da implementação de controlos adequados que permitam a resposta a disrupções de acordo com o Plano de Continuidade de Negócio."
      - "Evidência técnica da implementação de redundâncias técnicas nos sistemas críticos."
    questions:
      - id: PR.RI-4-S-Q1
        text: "Existem controlos para responder a tempo a interrupções das operações, como prevê o Plano de Continuidade de Negócio?"
        explanation: "Quando algo falha, a resposta deve seguir o que o plano diz, nos tempos previstos."
        example: "Se o servidor principal falhar, o servidor de reserva assume em menos de uma hora, como diz o plano."
        answers: ["yes", "partial", "no", "unknown"]
      - id: PR.RI-4-S-Q2
        text: "Os sistemas críticos têm mecanismos de disponibilidade, como balanceamento de carga e redundância?"
        explanation: "Estes mecanismos mantêm os sistemas a funcionar quando um componente falha ou fica sobrecarregado."
        example: "A loja online corre em dois servidores, e o tráfego é dividido entre eles."
        answers: ["yes", "partial", "no", "unknown"]

  - id: PR.RI-5-S
    title: "Capacidade suficiente dos sistemas"
    level: substantial
    technical: true
    evidence:
      - "Registo do planeamento da capacidade dos recursos para o processamento de informações dos sistemas críticos, redes, telecomunicações e armazenamento de dados."
    questions:
      - id: PR.RI-5-S-Q1
        text: "A empresa planeia e garante capacidade suficiente (processamento, rede, telecomunicações, armazenamento) para o volume atual e futuro dos sistemas críticos?"
        explanation: "Um sistema sem capacidade suficiente fica lento ou para quando o volume aumenta."
        example: "Uma revisão anual do espaço em disco e da capacidade da rede, com compras planeadas antes de faltar."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-1-B
    title: "Vigiar o tráfego da rede"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica de instalação, configuração e atualização de soluções de monitorização de tráfego da rede e proteção contra atividade não autorizada e potencialmente maliciosa."
    questions:
      - id: DE.MC-1-B-Q1
        text: "A empresa tem soluções de vigilância do tráfego da rede (como firewalls) bem configuradas, instaladas e atualizadas para bloquear atividade suspeita?"
        explanation: "Estas soluções detetam e bloqueiam ligações que podem ser um ataque."
        example: "A firewall regista e bloqueia tentativas de ligação vindas de endereços conhecidos por fazer ataques."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-1-S
    title: "Bloquear comunicações não autorizadas"
    level: substantial
    technical: true
    evidence:
      - "Evidência da monitorização, identificação e bloqueio de comunicações não autorizadas e conteúdo/ações malicioso/maliciosas."
    questions:
      - id: DE.MC-1-S-Q1
        text: "A empresa vigia, identifica e bloqueia comunicações não autorizadas, locais ou remotas, aos sistemas críticos, e remove conteúdo malicioso?"
        explanation: "Não basta detetar: as comunicações indevidas devem ser bloqueadas e o conteúdo malicioso removido."
        example: "Um sistema que bloqueia uma ligação estranha ao servidor de produção e coloca em quarentena um ficheiro infetado."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-1-E
    title: "Vigilância contínua com resposta automática"
    level: high
    technical: true
    evidence:
      - "Registo de monitorização contínua dos sistemas críticos quanto a potenciais incidentes."
    questions:
      - id: DE.MC-1-E-Q1
        text: "Os sistemas críticos são vigiados de forma contínua, com respostas automáticas quando surgem sinais de incidente?"
        explanation: "Uma resposta automática trava um ataque em segundos, sem esperar que alguém repare."
        example: "Quando é detetado ransomware num computador, este é isolado da rede automaticamente."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-2-S
    title: "Vigiar o ambiente físico"
    level: substantial
    technical: false
    evidence:
      - "Evidência técnica da monitorização do ambiente físico."
    questions:
      - id: DE.MC-2-S-Q1
        text: "O ambiente físico da empresa é vigiado para detetar situações que possam pôr a segurança em risco?"
        explanation: "Inclui, por exemplo, entradas indevidas, inundações ou falhas de energia."
        example: "Câmaras na entrada e um sensor de inundação na sala dos servidores."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-2-E
    title: "Alarmes e vigilância dos sistemas críticos"
    level: high
    technical: false
    evidence:
      - "Evidência técnica da implementação de alarmes de intrusão física e equipamento de vigilância no acesso físico aos sistemas e dispositivos críticos."
      - "Registo de monitorização do acesso físico por equipas independentes."
    questions:
      - id: DE.MC-2-E-Q1
        text: "O acesso físico aos sistemas e dispositivos críticos é vigiado com alarmes de intrusão, equipamento de vigilância e equipas de vigilância independentes?"
        explanation: "Neste nível, além das instalações, os próprios equipamentos críticos têm vigilância dedicada."
        example: "A sala dos servidores tem alarme de intrusão e câmaras ligadas a uma empresa de segurança externa."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-4-B
    title: "Antivírus e proteção dos computadores"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica da instalação de ferramentas de monitorização de postos cliente, e da sua atualização."
    questions:
      - id: DE.MC-4-B-Q1
        text: "Os computadores e outros equipamentos dos utilizadores têm ferramentas instaladas e atualizadas para detetar atividade maliciosa?"
        explanation: "São programas como antivírus que detetam vírus e comportamentos suspeitos em cada máquina."
        example: "Todos os computadores têm um antivírus com atualizações automáticas, gerido a partir de uma consola central."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-5-B
    title: "Aplicações aprovadas e uso de equipamentos pessoais"
    level: basic
    technical: false
    evidence:
      - "Registo das aplicações aprovadas para uso em ativos corporativos."
      - "Documentação da aprovação das exceções."
      - "Registo da inclusão de critérios para a Utilização de Dispositivos Pessoais no Trabalho (BYOD) na Política de Uso Aceitável."
    questions:
      - id: DE.MC-5-B-Q1
        text: "A empresa tem uma lista de aplicações aprovadas para os seus equipamentos, com as exceções aprovadas e registadas?"
        explanation: "Saber que aplicações são permitidas ajuda a detetar as que não deviam estar instaladas."
        example: "Uma lista com as aplicações autorizadas nos telemóveis da empresa, e um registo das exceções aprovadas."
        answers: ["yes", "partial", "no", "unknown"]
      - id: DE.MC-5-B-Q2
        text: "Se as pessoas usam equipamentos pessoais no trabalho, a Política de Uso Aceitável define as regras para isso?"
        explanation: "Telemóveis e computadores pessoais também acedem a dados da empresa e precisam de regras. Se ninguém usa equipamentos pessoais, responda 'sim'."
        example: "A política diz que o email da empresa no telemóvel pessoal só é permitido com bloqueio de ecrã e código."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-5-S
    title: "Regras para os telemóveis da empresa"
    level: substantial
    technical: false
    evidence:
      - "Registo documentado de inclusão na Política de Uso Aceitável de requisitos para a utilização de dispositivos móveis corporativos e registo da monitorização do cumprimento destes requisitos."
    questions:
      - id: DE.MC-5-S-Q1
        text: "A Política de Uso Aceitável tem regras para os dispositivos móveis da empresa, e o cumprimento dessas regras é vigiado?"
        explanation: "Os telemóveis e tablets da empresa também guardam e acedem a informação, e o seu uso deve ser acompanhado."
        example: "Um sistema de gestão de telemóveis que avisa quando um aparelho da empresa não tem bloqueio de ecrã."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-5-E
    title: "Gestão central de software e alertas"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da ferramenta centralizada de suporte de software."
      - "Evidência técnica de alarmística relativamente à instalação de software indevido e integração deste processo de gestão de incidentes."
    questions:
      - id: DE.MC-5-E-Q1
        text: "A instalação e o suporte de software são geridos numa ferramenta central?"
        explanation: "Uma ferramenta central permite saber e controlar o que está instalado em cada equipamento."
        example: "As aplicações são instaladas a partir de uma consola central, e não diretamente em cada aparelho."
        answers: ["yes", "partial", "no", "unknown"]
      - id: DE.MC-5-E-Q2
        text: "A instalação de software indevido gera alertas, tratados no processo de gestão de incidentes?"
        explanation: "Um alerta permite reagir logo que alguém instala algo que não devia."
        example: "Quando aparece um programa não autorizado num computador, é aberto automaticamente um pedido de análise."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-6-S
    title: "Vigiar os acessos de fornecedores"
    level: substantial
    technical: true
    evidence:
      - "Registo da monitorização de todas as ligações aos sistemas, aplicações ou infraestrutura da entidade, efetuadas por fornecedores ou qualquer entidade externa."
      - "Registo da avaliação periódica dos prestadores de serviços com acesso às redes e sistemas da entidade por forma a garantir o cumprimento dos requisitos de segurança previamente definidos."
    questions:
      - id: DE.MC-6-S-Q1
        text: "Todas as ligações de fornecedores ou outras entidades externas aos sistemas da empresa são vigiadas e protegidas?"
        explanation: "Um fornecedor com acesso aos sistemas pode, sem querer, trazer um ataque."
        example: "O acesso remoto do fornecedor de informática fica registado e só funciona através da VPN da empresa."
        answers: ["yes", "partial", "no", "unknown"]
      - id: DE.MC-6-S-Q2
        text: "A empresa confirma de forma contínua que os prestadores de serviços cumprem as suas políticas e os requisitos de segurança dos contratos?"
        explanation: "Os requisitos assinados no contrato devem ser verificados ao longo do tempo."
        example: "Uma verificação anual de que o fornecedor de alojamento mantém as medidas de segurança contratadas."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-7-S
    title: "Vigiar equipamentos, programas e dados em produção"
    level: substantial
    technical: true
    evidence:
      - "Evidência técnica da recolha de eventos potencialmente adversos."
    questions:
      - id: DE.MC-7-S-Q1
        text: "Os equipamentos, programas, sistemas em produção e os seus dados são vigiados para detetar situações potencialmente perigosas?"
        explanation: "Vigiar permite detetar cedo falhas, alterações estranhas ou sinais de ataque."
        example: "Alertas quando um servidor fica sem espaço, um serviço para ou um ficheiro importante é alterado."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.MC-7-E
    title: "Integridade do hardware e sistema de alertas"
    level: high
    technical: true
    evidence:
      - "Evidência técnica da monitorização de integridade de hardware dos sistemas críticos."
      - "Registo da inclusão da deteção de adulteração de hardware dos sistemas críticos no Plano de Resposta a Incidentes."
      - "Evidência técnica da implementação de sistemas de deteção de falsos positivos na deteção e bloqueio de código e atividades maliciosas."
    questions:
      - id: DE.MC-7-E-Q1
        text: "A empresa verifica a integridade do hardware dos sistemas críticos para detetar adulterações?"
        explanation: "Um equipamento adulterado pode dar acesso a um atacante mesmo com tudo o resto protegido."
        example: "Selos de segurança nos servidores, verificados mensalmente."
        answers: ["yes", "partial", "no", "unknown"]
      - id: DE.MC-7-E-Q2
        text: "O Plano de Resposta a Incidentes prevê o que fazer quando se deteta hardware adulterado nos sistemas críticos?"
        explanation: "Sem um procedimento previsto, a reação a um equipamento adulterado fica improvisada."
        example: "Um passo no plano que manda desligar o servidor, avisar o responsável e chamar o fornecedor quando um selo está partido."
        answers: ["yes", "partial", "no", "unknown"]
      - id: DE.MC-7-E-Q3
        text: "A empresa tem um sistema de deteção e alerta de eventos de segurança que distingue os falsos alarmes?"
        explanation: "Distinguir os falsos alarmes evita que os alertas verdadeiros se percam no meio dos outros."
        example: "Um sistema que junta os alertas, descarta os conhecidos como inofensivos e destaca os suspeitos."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.AE-1-S
    title: "Analisar os eventos detetados"
