    controls: [GR.FR-4-B, GR.FR-4-S, ID.GA-7-B, ID.GA-7-S, PR.GA-1-B, PR.GA-1-S, PR.GA-1-E, PR.FC-1-B, PR.FC-1-S, PR.FC-1-E, PR.FC-2-B, PR.FC-2-S, PR.SP-1-B, PR.SP-1-S, PR.SP-1-E, PR.SP-3-B, DE.MC-4-B]
