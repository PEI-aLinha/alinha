    level: high
    technical: false
    evidence:
      - "Registo da identificação e classificação dos dados e respetivos metadados, de acordo com a Política de Classificação e Gestão de Dados."
    questions:
      - id: ID.GA-6-E-Q1
        text: "A empresa identificou os dados que trata e classificou-os segundo a sua Política de Classificação e Gestão de Dados?"
        explanation: "Saber que dados existem e quão sensíveis são permite protegê-los na medida certa."
        example: "Os dados de clientes estão marcados como confidenciais e os catálogos de produtos como públicos."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.GA-7-B
    title: "Atualizações de segurança e manutenção"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica das atualizações de segurança e aplicação de patches nas aplicações e sistemas. Evidência técnica de aplicação de controlos compensatórios, que sejam aplicados de acordo com uma análise de risco, na eventual impossibilidade de realização de atualizações de segurança e de aplicação de patches. Registo da execução de manutenções de equipamentos e demais recursos físicos."
      - "Registo da aprovação das ações de manutenção de software e hardware."
    questions:
      - id: ID.GA-7-B-Q1
        text: "Os sistemas e aplicações recebem atualizações de segurança com regularidade, ou outras proteções quando não é possível atualizar?"
        explanation: "As atualizações corrigem falhas que os atacantes usam. Quando um sistema não pode ser atualizado, é preciso protegê-lo de outra forma."
        example: "As atualizações do Windows instalam-se todos os meses; uma máquina antiga que não pode ser atualizada fica isolada da internet."
        answers: ["yes", "partial", "no", "unknown"]
      - id: ID.GA-7-B-Q2
        text: "Os equipamentos têm manutenção periódica, e as ações de manutenção de software e hardware são aprovadas?"
        explanation: "A manutenção evita avarias, e aprová-la garante que ninguém mexe nos sistemas sem autorização."
        example: "Um registo das revisões feitas aos servidores, cada uma autorizada pelo responsável de informática."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.GA-7-S
    title: "Política de ciclo de vida dos ativos"
    level: substantial
    technical: false
    evidence:
      - "Política de Gestão do Ciclo de Vida de Ativos aprovada e implementada."
      - "Registo documentado do planeamento das ações de manutenção e reparações de componentes críticos dos sistemas, em conformidade com a Política de Gestão do Ciclo de Vida de Ativos."
    questions:
      - id: ID.GA-7-S-Q1
        text: "A empresa tem uma Política de Gestão do Ciclo de Vida de Ativos aprovada, que trata da perda, mau uso, dano ou roubo de ativos?"
        explanation: "A política diz como se gere um ativo desde que é comprado até ser abatido, incluindo o que fazer se for perdido ou roubado."
        example: "Uma política que diz o que fazer quando um portátil é roubado: avisar, bloquear o acesso e apagar os dados à distância."
        answers: ["yes", "partial", "no", "unknown"]
      - id: ID.GA-7-S-Q2
        text: "A manutenção preventiva e as reparações dos componentes críticos são planeadas, feitas e registadas segundo essa política?"
        explanation: "Planear a manutenção dos sistemas mais importantes evita que falhem quando são mais precisos."
        example: "Um calendário de manutenção dos servidores e um registo de cada reparação feita."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.GA-8-S
    title: "Destruir dados de forma segura"
    level: substantial
    technical: true
    evidence:
      - "Registo da inclusão de medidas para a destruição dos dados dos sistemas críticos e das informações sensíveis na Política de Classificação e Gestão de Dados."
    questions:
      - id: ID.GA-8-S-Q1
        text: "Os dados dos sistemas críticos e a informação sensível são destruídos como manda a Política de Classificação e Gestão de Dados?"
        explanation: "Apagar um ficheiro não chega: os dados podem ser recuperados de discos ou papéis deitados fora."
        example: "Os discos dos computadores abatidos são destruídos por uma empresa certificada, que entrega um certificado."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.GA-8-E
    title: "Documentar e testar a destruição de dados"
    level: high
    technical: true
    evidence:
      - "Registo do processo de sanitização e dos testes realizados."
    questions:
      - id: ID.GA-8-E-Q1
        text: "Os processos de destruição de dados, em papel e digitais, estão documentados e testados para confirmar que funcionam?"
        explanation: "Testar confirma que os dados destruídos não podem mesmo ser recuperados."
        example: "Depois de apagar um disco, tenta-se recuperar os dados com uma ferramenta própria para confirmar que não é possível."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.GA-9-E
    title: "Gestão de alterações aos sistemas"
    level: high
    technical: true
    evidence:
      - "Registo do processo documentado de gestão de alterações que inclua, pelo menos, a avaliação e aprovação prévia das regras para a realização de alterações."
      - "Registo do resultado dos testes e da validação às alterações efetuadas antes da sua implementação em produção."
      - "Evidência de uma gestão do quotidiano que reflita atualizações de procedimentos quando existam alterações."
    questions:
      - id: ID.GA-9-E-Q1
        text: "A empresa tem regras para avaliar e aprovar antes as alterações aos seus sistemas?"
        explanation: "Uma alteração feita sem avaliação pode parar um serviço ou abrir uma falha de segurança."
        example: "Antes de mudar a configuração do servidor, o pedido é avaliado e aprovado pelo responsável."
        answers: ["yes", "partial", "no", "unknown"]
      - id: ID.GA-9-E-Q2
        text: "As alterações são testadas antes de chegarem aos sistemas em produção, e os procedimentos são atualizados a seguir?"
        explanation: "Testar evita surpresas, e atualizar os procedimentos garante que a documentação corresponde ao que existe."
        example: "Uma nova versão do programa de faturação é testada num computador à parte antes de ser instalada para todos."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-1-B
    title: "Identificar vulnerabilidades"
