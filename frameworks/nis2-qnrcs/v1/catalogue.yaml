    questions:
      - id: DE.AE-6-B-Q1
        text: "A empresa definiu a partir de quando um evento, ou um conjunto de eventos, passa a ser considerado um incidente?"
        explanation: "Definir este limite ajuda a decidir quando ativar o plano de resposta a incidentes."
        example: "Mais de 10 tentativas de entrada falhadas na mesma conta, ou qualquer ficheiro encriptado sem motivo, é um incidente."
        answers: ["yes", "partial", "no", "unknown"]

