    questions:
      - id: DE.AE-2-B-Q1
        text: "A recolha de eventos de segurança está ativa nos sistemas e aplicações, e esses eventos são analisados e guardados em cópia durante o tempo definido?"
        explanation: "Sem eventos guardados não é possível perceber o que aconteceu num incidente."
        example: "Os registos de segurança do servidor estão ativos, são revistos e copiados para um arquivo durante seis meses."
        answers: ["yes", "partial", "no", "unknown"]

