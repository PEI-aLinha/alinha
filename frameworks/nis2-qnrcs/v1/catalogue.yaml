controls:
  - id: GR.CO-1-S
    title: "Missão, objetivos e prioridades de cibersegurança"
    level: substantial
    technical: false
    evidence:
      - "Registo documentado da missão, visão, estratégia de gestão do risco e objetivos no âmbito da cibersegurança e respetivas prioridades."
    questions:
      - id: GR.CO-1-S-Q1
        text: "A empresa tem por escrito a sua missão, visão, estratégia de gestão dos riscos, objetivos e prioridades de cibersegurança, e deu-os a conhecer?"
        explanation: "Saber o que é mais importante para a empresa ajuda a decidir o que proteger primeiro."
        example: "Um documento aprovado pela gerência que diz que a prioridade é manter a faturação e a produção a funcionar, partilhado com as chefias."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.CO-3-B
    title: "Conhecer as obrigações legais de cibersegurança"
    level: basic
    technical: false
    evidence:
      - "Evidência da gestão quotidiana da entidade que demonstre o cumprimento dos requisitos e obrigações legais de cibersegurança aplicáveis à entidade."
    questions:
      - id: GR.CO-3-B-Q1
        text: "A empresa sabe que leis e regulamentos de cibersegurança tem de cumprir e aplica-os no dia a dia?"
        explanation: "Saber que regras se aplicam é o primeiro passo para as cumprir."
        example: "Uma lista com o Regime Jurídico da Cibersegurança e o RGPD, com quem trata de cada obrigação."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.CO-4-B
    title: "Serviços de que os clientes dependem"
    level: basic
    technical: false
    evidence:
      - "Registo documentado da identificação dos serviços críticos dos quais as partes interessadas externas dependem."
    questions:
      - id: GR.CO-4-B-Q1
        text: "A empresa tem por escrito quais dos seus serviços são críticos para os clientes ou outras entidades que dependem dela?"
        explanation: "São os serviços que, se pararem, causam problemas sérios a quem depende da empresa."
        example: "Uma lista que indica que a entrega de peças a um fabricante automóvel não pode parar mais de um dia."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.CO-4-S
    title: "Prioridade dos serviços críticos na gestão de riscos"
    level: substantial
    technical: false
    evidence:
      - "Registo do processo de gestão dos riscos que contempla os serviços críticos das quais as partes interessadas externas dependem, incluindo a definição de critérios para a classificação e priorização dos serviços críticos."
    questions:
      - id: GR.CO-4-S-Q1
        text: "Os serviços críticos da empresa estão classificados por importância e entram na análise de riscos?"
        explanation: "Os serviços mais importantes devem ter os riscos analisados e tratados primeiro."
        example: "Na análise de riscos, a faturação aparece como prioridade alta e o site institucional como prioridade baixa."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.CO-5-B
    title: "O que é preciso para os serviços críticos continuarem"
    level: basic
    technical: false
    evidence:
      - "Registo documentando da identificação dos requisitos de resiliência necessários para garantir o suporte dos serviços críticos."
    questions:
      - id: GR.CO-5-B-Q1
        text: "A empresa registou o que é preciso para os seus serviços críticos continuarem a funcionar, mesmo com problemas?"
        explanation: "Por exemplo, quanto tempo um serviço pode estar parado e de que sistemas depende."
        example: "Um registo que diz que as encomendas não podem parar mais de 4 horas e dependem do servidor de gestão e da internet."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.CO-5-S
    title: "Redundância e plano de continuidade"
    level: substantial
    technical: false
    evidence:
      - "Evidencia técnica da implementação de mecanismos de redundância que garantam a disponibilidade dos serviços críticos."
      - "Plano de Continuidade de Negócio aprovado e implementado e que contenha a definição dos tempos necessários para a recuperação de cada serviço critico e respetivos processos."
    questions:
      - id: GR.CO-5-S-Q1
        text: "Os serviços críticos têm alternativas preparadas (redundância) para continuarem a funcionar se algo falhar?"
        explanation: "Redundância é ter um segundo meio pronto a entrar quando o principal falha."
        example: "Duas ligações à internet de operadores diferentes, ou um segundo servidor pronto a substituir o principal."
        answers: ["yes", "partial", "no", "unknown"]
      - id: GR.CO-5-S-Q2
        text: "A empresa tem um Plano de Continuidade de Negócio aprovado, com os tempos de recuperação de cada serviço crítico?"
        explanation: "O plano diz o que fazer e em quanto tempo para pôr os serviços críticos a funcionar depois de uma falha grave."
        example: "Um plano aprovado pela gerência que diz que a faturação tem de voltar a funcionar em menos de um dia, e como."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.CO-5-E
    title: "Testar o plano de continuidade"
    level: high
    technical: false
    evidence:
      - "Evidência da execução de testes ao Plano de Continuidade de Negócio."
    questions:
      - id: GR.CO-5-E-Q1
        text: "O Plano de Continuidade de Negócio é testado com regularidade?"
        explanation: "Um plano que nunca foi testado pode falhar quando for preciso."
        example: "Uma simulação anual em que se desliga o servidor principal e se confirma que o serviço volta no tempo previsto."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.CO-6-B
    title: "Serviços externos de que a empresa depende"
    level: basic
    technical: false
    evidence:
      - "Registo da identificação, e da comunicação dos serviços críticos externos dos quais a entidade depende."
      - "Registo do processo de gestão dos riscos que contempla os serviços críticos externos dos quais a entidade depende, incluindo a definição de critérios para a classificação e priorização destes serviços."
    questions:
      - id: GR.CO-6-B-Q1
        text: "A empresa tem uma lista, por ordem de importância, dos serviços externos críticos de que depende, e comunicou-a a quem precisa de saber?"
        explanation: "São serviços de outras empresas sem os quais a sua não funciona, como o fornecedor de internet ou o software de faturação."
        example: "Uma lista com o operador de internet, o serviço de email e o programa de contabilidade, com a importância de cada um."
        answers: ["yes", "partial", "no", "unknown"]
      - id: GR.CO-6-B-Q2
        text: "Esses serviços externos críticos entram na análise de riscos da empresa?"
        explanation: "Se um fornecedor falhar, a empresa também é afetada, por isso esse risco tem de ser analisado."
        example: "A análise de riscos inclui o que acontece se o serviço de email na nuvem ficar indisponível."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.GR-1-S
    title: "Risco que a empresa aceita correr"
    level: substantial
    technical: false
    evidence:
      - "Registo documentado e aprovado da definição do apetite e tolerância ao risco."
      - "Registo da sua comunicação às partes interessadas internas."
    questions:
      - id: GR.GR-1-S-Q1
        text: "A empresa definiu e aprovou quanto risco está disposta a aceitar, comunica-o internamente e revê-o com regularidade?"
        explanation: "É decidir que riscos são aceitáveis e quais têm de ser reduzidos, para não decidir caso a caso."
        example: "A gerência aprovou que qualquer risco que possa parar a produção mais de um dia tem de ser tratado."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.GR-2-B
    title: "Processo de gestão de riscos de cibersegurança"
    level: basic
    technical: false
    evidence:
      - "Evidência da gestão quotidiana que demonstre a implementação das várias fases de gestão de riscos da cibersegurança."
    questions:
      - id: GR.GR-2-B-Q1
        text: "A empresa tem um processo aprovado para identificar e gerir os riscos de cibersegurança, e mantém-no atualizado?"
        explanation: "Gerir riscos é ver o que pode correr mal, quão grave seria e o que fazer para o evitar."
        example: "Uma vez por ano, a empresa revê uma lista de riscos (como um ataque de ransomware, um programa que bloqueia os ficheiros e pede um resgate) e as medidas para cada um."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.GR-2-S
    title: "Riscos de cibersegurança na gestão de riscos geral"
    level: substantial
    technical: false
    evidence:
      - "Evidência de gestão quotidiana que demonstre a implementação das várias fases de gestão de risco da cibersegurança nos processos transversais de gestão dos riscos da entidade."
    questions:
      - id: GR.GR-2-S-Q1
        text: "Os riscos de cibersegurança fazem parte da gestão de riscos geral da empresa, junto com os riscos financeiros e operacionais?"
        explanation: "A cibersegurança não deve ser tratada à parte: os seus riscos afetam o negócio como os outros."
        example: "O mapa de riscos da empresa tem, ao lado do risco de perder um cliente grande, o risco de um ataque informático."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.GR-3-S
    title: "Estratégia para tratar os riscos"
    level: substantial
    technical: false
    evidence:
      - "Registo documentado da estratégia de tratamento do risco e da sua comunicação às partes interessadas."
    questions:
      - id: GR.GR-3-S-Q1
        text: "A empresa definiu como trata os riscos (reduzir, aceitar, transferir ou evitar) e comunicou-o a quem precisa de saber?"
        explanation: "Para cada risco há várias opções, por exemplo fazer um seguro ou mudar a forma de trabalhar."
        example: "A empresa decidiu fazer um seguro de ciber-risco e reduzir os restantes riscos com cópias de segurança."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.GR-4-S
    title: "Canal interno para falar de riscos"
    level: substantial
    technical: false
    evidence:
      - "Canal interno de comunicação usado para a partilha de riscos de cibersegurança."
    questions:
      - id: GR.GR-4-S-Q1
        text: "Existe um canal interno para partilhar informação sobre riscos de cibersegurança com a gerência e as áreas relevantes?"
        explanation: "Quem deteta um risco deve saber a quem o comunicar, e a gerência deve ser informada."
        example: "Uma reunião mensal entre o responsável de informática e a gerência, ou um endereço de email próprio para estes assuntos."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.GR-5-S
    title: "Método para avaliar os riscos"
    level: substantial
    technical: false
    evidence:
      - "Registo da metodologia de gestão dos riscos de cibersegurança."
    questions:
      - id: GR.GR-5-S-Q1
        text: "A empresa tem um método definido para identificar, registar, calcular e ordenar os riscos de cibersegurança?"
        explanation: "Um método igual para todos os riscos permite compará-los e decidir quais tratar primeiro."
        example: "Cada risco recebe uma nota de 1 a 5 para a probabilidade e outra para o impacto, e multiplica-se uma pela outra."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.GR-5-E
    title: "Política de gestão de riscos de cibersegurança"
    level: high
    technical: false
    evidence:
      - "Política de Gestão dos Riscos de Cibersegurança aprovada e implementada."
    questions:
      - id: GR.GR-5-E-Q1
        text: "A empresa tem uma Política de Gestão dos Riscos de Cibersegurança aprovada e em prática?"
        explanation: "A política é o documento oficial que diz como a empresa gere os riscos de cibersegurança."
        example: "Uma política aprovada pela administração, que todos os responsáveis de área seguem."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.FR-1-B
    title: "Recursos da gerência para a cibersegurança"
    level: basic
    technical: false
    evidence:
      - "Plano de Melhoria Contínua de Cibersegurança com medidas, prazos e recursos a afetar, aprovado pelos órgãos de gestão, direção e administração."
    questions:
      - id: GR.FR-1-B-Q1
        text: "A gerência disponibiliza os recursos necessários para melhorar a cibersegurança, com um plano aprovado?"
        explanation: "Melhorar a cibersegurança precisa de tempo, pessoas e orçamento decididos pela gerência."
        example: "Um plano de melhoria com medidas, prazos e orçamento, aprovado pela gerência."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.FR-2-S
    title: "Recursos adequados à gestão de riscos"
    level: substantial
    technical: false
    evidence:
      - "Registo do planeamento das atividades em matéria de cibersegurança a curto ou médio prazo, e evidência da gestão quotidiana que demonstre a alocação dos recursos para a gestão do risco de cibersegurança."
    questions:
      - id: GR.FR-2-S-Q1
        text: "Os recursos dedicados à cibersegurança (pessoas, tempo, orçamento) são suficientes para as funções e políticas que a empresa definiu?"
        explanation: "Não basta ter políticas: é preciso ter quem as aplique e meios para isso."
        example: "Uma verba anual para cibersegurança e um técnico com tempo dedicado, previstos no orçamento."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.FR-3-S
    title: "Funções e responsabilidades de cibersegurança"
    level: substantial
    technical: false
    evidence:
      - "Registo documentado e aprovado das funções, responsabilidades e autoridades e da sua comunicação às partes interessadas."
    questions:
      - id: GR.FR-3-S-Q1
        text: "As funções e responsabilidades de cibersegurança estão por escrito, aprovadas, comunicadas a quem as tem e atualizadas?"
        explanation: "Cada pessoa deve saber o que lhe cabe fazer em matéria de cibersegurança."
        example: "Um documento que indica o responsável de cibersegurança, quem trata das cópias de segurança e quem contacta os fornecedores."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.FR-4-B
    title: "Regras de uso dos equipamentos e sistemas"
    level: basic
    technical: false
    evidence:
      - "Política de Uso Aceitável aprovada e implementada e registo da tomada de conhecimento pelo pessoal aquando da sua entrada."
    questions:
      - id: GR.FR-4-B-Q1
        text: "A empresa tem uma Política de Uso Aceitável e dá-a a conhecer a cada pessoa quando entra?"
        explanation: "É o documento com as regras para usar com segurança os computadores, o email e os outros recursos da empresa."
