        explanation: "Quem tem de investigar ou responder precisa de receber a informação a tempo."
        example: "Os alertas de segurança chegam por email ao técnico de serviço e ficam registados na ferramenta de incidentes."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.AE-6-B
    title: "Quando um evento é um incidente"
