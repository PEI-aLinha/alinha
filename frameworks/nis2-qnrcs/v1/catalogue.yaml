    questions:
      - id: ID.AR-4-B-Q1
        text: "Na gestão de riscos, a empresa regista a probabilidade de cada ameaça acontecer e o impacto que teria?"
        explanation: "Estimar a probabilidade e o impacto ajuda a perceber quais as ameaças mais graves."
        example: "Um ataque de ransomware (um programa que bloqueia os ficheiros e pede um resgate) tem probabilidade média e impacto alto, porque pararia a produção."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-5-B
    title: "Avaliar os riscos"
    level: basic
    technical: false
    evidence:
      - "Evidência da gestão quotidiana que demonstre realização de avaliações do risco tendo como base a análise de ameaças, vulnerabilidades, probabilidades e impactos nos processos e ativos organizacionais"
    questions:
      - id: ID.AR-5-B-Q1
        text: "A empresa avalia os riscos com base nas ameaças, vulnerabilidades, probabilidade e impacto, incluindo os ativos dos serviços críticos?"
        explanation: "A avaliação junta tudo o que pode correr mal para decidir onde atuar."
        example: "Uma análise de riscos anual que cobre os sistemas de faturação, produção e email."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-5-S
    title: "Avaliação de riscos contínua"
    level: substantial
    technical: false
    evidence:
      - "Registo documentado da avaliação do risco e respetiva atualização, tendo por base os critérios definidos na metodologia."
    questions:
      - id: ID.AR-5-S-Q1
        text: "As avaliações de risco são feitas, registadas e atualizadas de forma contínua, segundo a metodologia da empresa?"
        explanation: "Os riscos mudam ao longo do ano, por isso a avaliação deve acompanhar essas mudanças."
        example: "A análise de riscos é atualizada sempre que entra um sistema novo, e não só uma vez por ano."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-6-B
    title: "Controlos para os riscos identificados"
    level: basic
    technical: true
    evidence:
      - "Evidência técnica da implementação de controlos de segurança para os riscos identificados."
    questions:
      - id: ID.AR-6-B-Q1
        text: "A empresa aplicou medidas de segurança para os riscos que identificou?"
        explanation: "Para cada risco importante deve haver uma medida que o reduza."
        example: "Para o risco de perda de dados, a empresa passou a fazer cópias de segurança diárias."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-6-S
    title: "Planear e acompanhar as respostas aos riscos"
    level: substantial
    technical: false
    evidence:
      - "Registo da identificação, priorização, planeamento, acompanhamento e comunicação das respostas aos riscos."
    questions:
      - id: ID.AR-6-S-Q1
        text: "As respostas aos riscos são priorizadas, planeadas, acompanhadas e comunicadas?"
        explanation: "Um plano com prioridades, prazos e responsáveis garante que as medidas são mesmo aplicadas."
        example: "Uma lista de medidas com o responsável e o prazo de cada uma, revista mensalmente."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-6-E
    title: "Melhorar continuamente as respostas aos riscos"
    level: high
    technical: false
    evidence:
      - "Registo da inclusão de um plano de monitorização, revisão e melhoria contínua, na estratégia de tratamento dos riscos."
    questions:
      - id: ID.AR-6-E-Q1
        text: "A estratégia de tratamento dos riscos inclui um plano para monitorizar, rever e melhorar as respostas aos riscos?"
        explanation: "É preciso confirmar que as medidas funcionam e ajustá-las quando não chegam."
        example: "Todos os trimestres verifica-se se as medidas reduziram os riscos e decidem-se melhorias."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-7-B
    title: "Tratar as vulnerabilidades conhecidas"
    level: basic
    technical: true
    evidence:
      - "Registo da identificação e de tratamento das vulnerabilidades."
    questions:
      - id: ID.AR-7-B-Q1
        text: "A empresa corrige as vulnerabilidades de que tem conhecimento?"
        explanation: "Uma falha conhecida e não corrigida é das formas mais fáceis de um atacante entrar."
        example: "Quando o fabricante do router avisa de uma falha, a empresa instala a correção."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-7-S
    title: "Processo de gestão de vulnerabilidades"
    level: substantial
    technical: true
    evidence:
      - "Registo dos processos de gestão de vulnerabilidades que incluam processamento, análise e correção de vulnerabilidades de fontes internas e externas, o qual deve estar alinhado com a Instrução Técnica de Divulgação Coordenada de Vulnerabilidades."
    questions:
      - id: ID.AR-7-S-Q1
        text: "A empresa tem um processo para receber, analisar e corrigir vulnerabilidades vindas de fontes internas e externas?"
        explanation: "As falhas podem ser descobertas pela equipa, por fornecedores ou por alertas públicos, e todas devem ser tratadas."
        example: "Os alertas do CNCS e dos fabricantes são registados, analisados e corrigidos por ordem de gravidade."
        answers: ["yes", "partial", "no", "unknown"]
      - id: ID.AR-7-S-Q2
        text: "Esse processo segue a Instrução Técnica de Divulgação Coordenada de Vulnerabilidades do CNCS?"
        explanation: "A instrução técnica do CNCS diz como receber e tratar falhas comunicadas por terceiros."
        example: "A empresa tem um contacto público para quem descobrir uma falha a poder comunicar, como pede a instrução."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-7-E
    title: "Análise sistemática e acompanhamento automático"
    level: high
    technical: true
    evidence:
      - "Registo do resultado da análise e avaliação das vulnerabilidades identificadas."
      - "Evidência técnica da implementação de mecanismos automatizados para a divulgação e acompanhamento dos esforços de correção de vulnerabilidades."
    questions:
      - id: ID.AR-7-E-Q1
        text: "As vulnerabilidades registadas são analisadas e avaliadas de forma sistemática?"
        explanation: "Todas as falhas registadas devem ser avaliadas segundo os mesmos critérios, sem exceções."
        example: "Cada falha registada recebe uma gravidade e um prazo de correção."
        answers: ["yes", "partial", "no", "unknown"]
      - id: ID.AR-7-E-Q2
        text: "A empresa usa meios automáticos para comunicar e acompanhar a correção das vulnerabilidades junto das partes interessadas?"
        explanation: "Meios automáticos mostram a quem precisa de saber em que ponto está a correção de cada falha."
        example: "Uma ferramenta de tickets que avisa automaticamente os responsáveis e mostra o estado de cada correção."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.MC-2-E
    title: "Melhorias a partir de testes e exercícios"
    level: high
    technical: false
    evidence:
      - "Registo da realização de testes e exercícios de cibersegurança, incluindo os efetuados com partes interessadas."
    questions:
      - id: ID.MC-2-E-Q1
        text: "A empresa usa os testes e exercícios de cibersegurança para encontrar melhorias, e faz testes com as partes interessadas?"
        explanation: "Os exercícios mostram o que não funciona como esperado antes de acontecer um incidente real."
        example: "Depois de uma simulação de ataque com o fornecedor de informática, a empresa atualiza o plano de resposta."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.MC-3-B
    title: "Lições aprendidas depois de incidentes"
    level: basic
    technical: false
    evidence:
      - "Registo documentado das avaliações pósincidentes, com identificação de lições aprendidas, definição e implementação de melhorias."
    questions:
      - id: ID.MC-3-B-Q1
        text: "Depois de um incidente, a empresa analisa o que aconteceu para aprender e melhorar os processos e a tecnologia?"
        explanation: "Cada incidente mostra pontos fracos que se podem corrigir para não se repetirem."
        example: "Depois de um email falso enganar um colaborador, a empresa fez uma sessão de sensibilização e ativou um filtro de email."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.MC-3-S
    title: "Melhorias a partir da monitorização"
    level: substantial
    technical: false
    evidence:
