# NIS2 / RJC / QNRCS catalogue v1 (alinha#22).
# Field names and values in English; user-facing text in Portuguese.
#
# Requirements: every QNRCS control with a mandatory measure in Annex III of Regulamento 756/2026 (text from
# Annex I, the QNRCS), plus the areas of RJC art. 27.º n.º 1. Controls: one per Annex III row, i.e. per QNRCS
# control and compliance level (<code>-B basic, -S substantial, -E high). Levels are cumulative (Regulamento
# 756/2026, art. 30.º n.º 2): an entity at a level answers the controls of that level and the ones below.
# Evidence: the row's verification criteria, verbatim. Titles and questions are plain-language and ours.
# Not covered: Annex IV (relevant public entities) and QNRCS controls with no Annex III measure.
# RJC-27-1-*: our mapping of each art. 27.º area to QNRCS controls, pending advisor review. No Annex III control
# covers the "sistemas seguros de comunicações de emergência" of al. i).
framework: nis2-qnrcs
version: 1
title: "NIS2 — Regime Jurídico da Cibersegurança"
sources:
  - "Decreto-Lei n.º 125/2025"
  - "Regulamento n.º 756/2026"

requirements:
  - id: QNRCS-GR.CO-1
    reference: "Regulamento 756/2026, anexos I e III, GR.CO-1"
    text: "A missão, visão, estratégia de gestão dos riscos e objetivos da entidade são definidos e comunicados."
    controls: [GR.CO-1-S]
  - id: QNRCS-GR.CO-3
    reference: "Regulamento 756/2026, anexos I e III, GR.CO-3"
    text: "Os requisitos legais, regulamentares e contratuais para a cibersegurança, são compreendidos e geridos."
    controls: [GR.CO-3-B]
  - id: QNRCS-GR.CO-4
    reference: "Regulamento 756/2026, anexos I e III, GR.CO-4"
    text: "Os serviços críticos da entidade dos quais as partes interessadas externas dependem são identificados e comunicados."
    controls: [GR.CO-4-B, GR.CO-4-S]
  - id: QNRCS-GR.CO-5
    reference: "Regulamento 756/2026, anexos I e III, GR.CO-5"
    text: "Os requisitos de resiliência necessários para suportar a prestação de serviços críticos são definidos."
    controls: [GR.CO-5-B, GR.CO-5-S, GR.CO-5-E]
  - id: QNRCS-GR.CO-6
    reference: "Regulamento 756/2026, anexos I e III, GR.CO-6"
    text: "Os serviços externos dos quais a entidade depende, são identificados e comunicados."
    controls: [GR.CO-6-B]
  - id: QNRCS-GR.GR-1
    reference: "Regulamento 756/2026, anexos I e III, GR.GR-1"
    text: "O apetite e a tolerância ao risco da entidade são definidos, aprovados, comunicados e revistos regularmente."
    controls: [GR.GR-1-S]
  - id: QNRCS-GR.GR-2
    reference: "Regulamento 756/2026, anexos I e III, GR.GR-2"
    text: "Os processos de gestão dos riscos de cibersegurança estão incluídos na estratégia transversal de gestão dos riscos da entidade."
    controls: [GR.GR-2-B, GR.GR-2-S]
  - id: QNRCS-GR.GR-3
    reference: "Regulamento 756/2026, anexos I e III, GR.GR-3"
    text: "A entidade define a sua estratégia de tratamento do risco."
    controls: [GR.GR-3-S]
  - id: QNRCS-GR.GR-4
    reference: "Regulamento 756/2026, anexos I e III, GR.GR-4"
    text: "A entidade estabelece um canal de comunicação interno para partilha de riscos de cibersegurança."
    controls: [GR.GR-4-S]
  - id: QNRCS-GR.GR-5
    reference: "Regulamento 756/2026, anexos I e III, GR.GR-5"
    text: "A entidade define uma Política de Gestão dos Riscos de Cibersegurança a qual prevê uma metodologia para a gestão dos riscos de cibersegurança."
    controls: [GR.GR-5-S, GR.GR-5-E]
  - id: QNRCS-GR.FR-1
    reference: "Regulamento 756/2026, anexos I e III, GR.FR-1"
    text: "Os órgãos de gestão, direção e administração compreendem as suas funções e responsabilidades, e promovem uma cultura de cibersegurança, ética e de melhoria contínua."
    controls: [GR.FR-1-B]
  - id: QNRCS-GR.FR-2
    reference: "Regulamento 756/2026, anexos I e III, GR.FR-2"
    text: "São atribuídos recursos adequados e proporcionais à estratégia de gestão do risco de cibersegurança, às funções, responsabilidades e políticas de cibersegurança da entidade."
    controls: [GR.FR-2-S]
  - id: QNRCS-GR.FR-3
    reference: "Regulamento 756/2026, anexos I e III, GR.FR-3"
    text: "As funções, responsabilidades e autoridades em matéria de cibersegurança são definidas e comunicadas ao pessoal, fornecedores e partes interessadas."
    controls: [GR.FR-3-S]
  - id: QNRCS-GR.FR-4
    reference: "Regulamento 756/2026, anexos I e III, GR.FR-4"
    text: "A cibersegurança é contemplada nos processos de gestão de recursos humanos."
    controls: [GR.FR-4-B, GR.FR-4-S]
  - id: QNRCS-GR.PP-1
    reference: "Regulamento 756/2026, anexos I e III, GR.PP-1"
    text: "As Políticas para a gestão de Cibersegurança, incluindo a Política de Cibersegurança, são definidas com base no contexto organizacional, na estratégia de cibersegurança e nas prioridades da entidade."
    controls: [GR.PP-1-B, GR.PP-1-S]
  - id: QNRCS-GR.PP-2
    reference: "Regulamento 756/2026, anexos I e III, GR.PP-2"
    text: "O Plano de Resposta a Incidentes é definido, comunicado, mantido e melhorado."
    controls: [GR.PP-2-B]
  - id: QNRCS-GR.PP-3
    reference: "Regulamento 756/2026, anexos I e III, GR.PP-3"
    text: "O Plano de Recuperação de Desastres é definido, comunicado, mantido e melhorado."
    controls: [GR.PP-3-S]
  - id: QNRCS-GR.SP-2
    reference: "Regulamento 756/2026, anexos I e III, GR.SP-2"
    text: "A estratégia de gestão de riscos de cibersegurança é regularmente revista e adaptada para garantir a cobertura dos requisitos e riscos organizacionais."
    controls: [GR.SP-2-E]
  - id: QNRCS-GR.SP-3
    reference: "Regulamento 756/2026, anexos I e III, GR.SP-3"
    text: "O desempenho da gestão dos riscos de cibersegurança da entidade é avaliado e revisto para alterações necessárias."
    controls: [GR.SP-3-E]
  - id: QNRCS-GR.CA-1
    reference: "Regulamento 756/2026, anexos I e III, GR.CA-1"
    text: "As políticas e processos de gestão dos riscos da cadeia de abastecimento são identificados, estabelecidos, avaliados e geridos."
    controls: [GR.CA-1-E]
  - id: QNRCS-GR.CA-3
    reference: "Regulamento 756/2026, anexos I e III, GR.CA-3"
    text: "Os processos de gestão dos riscos de cibersegurança da cadeia de abastecimento da entidade estão incluídos nos processos transversais de cibersegurança e na estratégia de gestão dos riscos da entidade."
    controls: [GR.CA-3-S]
  - id: QNRCS-GR.CA-5
    reference: "Regulamento 756/2026, anexos I e III, GR.CA-5"
    text: "A entidade define e integra nos contratos e outros acordos com fornecedores os requisitos para gerir os riscos de cibersegurança da cadeia de abastecimento."
    controls: [GR.CA-5-S, GR.CA-5-E]
  - id: QNRCS-GR.CA-6
    reference: "Regulamento 756/2026, anexos I e III, GR.CA-6"
    text: "Antes da contratação de fornecedores são realizados processos de devida diligência para reduzir os riscos da entidade."
    controls: [GR.CA-6-E]
  - id: QNRCS-GR.CA-7
    reference: "Regulamento 756/2026, anexos I e III, GR.CA-7"
    text: "A entidade avalia os riscos de cibersegurança da cadeia de abastecimento."
    controls: [GR.CA-7-B, GR.CA-7-S, GR.CA-7-E]
  - id: QNRCS-GR.CA-8
    reference: "Regulamento 756/2026, anexos I e III, GR.CA-8"
    text: "O Plano de Resposta a Incidentes e o Plano de Recuperação de Desastres são testados com o acompanhamento dos fornecedores."
    controls: [GR.CA-8-S, GR.CA-8-E]
  - id: QNRCS-ID.GA-1
    reference: "Regulamento 756/2026, anexos I e III, ID.GA-1"
    text: "Os equipamentos e os demais recursos físicos geridos ou detidos pela entidade são inventariados."
    controls: [ID.GA-1-B, ID.GA-1-E]
  - id: QNRCS-ID.GA-2
    reference: "Regulamento 756/2026, anexos I e III, ID.GA-2"
    text: "Os recursos lógicos que suportam os processos dos serviços da entidade são inventariados"
    controls: [ID.GA-2-B, ID.GA-2-E]
  - id: QNRCS-ID.GA-3
    reference: "Regulamento 756/2026, anexos I e III, ID.GA-3"
    text: "As redes e fluxos de comunicação são mapeados."
    controls: [ID.GA-3-S, ID.GA-3-E]
  - id: QNRCS-ID.GA-4
    reference: "Regulamento 756/2026, anexos I e III, ID.GA-4"
    text: "Os serviços prestados por fornecedores são inventariados."
    controls: [ID.GA-4-B]
  - id: QNRCS-ID.GA-5
    reference: "Regulamento 756/2026, anexos I e III, ID.GA-5"
    text: "Os ativos são classificados de acordo com a sua criticidade."
    controls: [ID.GA-5-B]
  - id: QNRCS-ID.GA-6
    reference: "Regulamento 756/2026, anexos I e III, ID.GA-6"
    text: "Os dados e respetivos metadados são identificados e registados."
    controls: [ID.GA-6-E]
  - id: QNRCS-ID.GA-7
    reference: "Regulamento 756/2026, anexos I e III, ID.GA-7"
    text: "Sistemas, hardware, software, serviços e dados são geridos ao longo dos seus ciclos de vida"
    controls: [ID.GA-7-B, ID.GA-7-S]
  - id: QNRCS-ID.GA-8
    reference: "Regulamento 756/2026, anexos I e III, ID.GA-8"
    text: "Os dados são destruídos de acordo com a Política de Classificação e Gestão de Dados definida."
    controls: [ID.GA-8-S, ID.GA-8-E]
  - id: QNRCS-ID.GA-9
    reference: "Regulamento 756/2026, anexos I e III, ID.GA-9"
    text: "A entidade implementa um processo de gestão de alterações."
    controls: [ID.GA-9-E]
  - id: QNRCS-ID.AR-1
    reference: "Regulamento 756/2026, anexos I e III, ID.AR-1"
    text: "As vulnerabilidades dos ativos são identificadas e documentadas com base na metodologia definida."
    controls: [ID.AR-1-B, ID.AR-1-S, ID.AR-1-E]
  - id: QNRCS-ID.AR-4
    reference: "Regulamento 756/2026, anexos I e III, ID.AR-4"
    text: "São identificados e registados potenciais impactos e as respetivas probabilidades de ameaças."
    controls: [ID.AR-4-B]
  - id: QNRCS-ID.AR-5
    reference: "Regulamento 756/2026, anexos I e III, ID.AR-5"
    text: "A entidade avalia os riscos identificados."
    controls: [ID.AR-5-B, ID.AR-5-S]
  - id: QNRCS-ID.AR-6
    reference: "Regulamento 756/2026, anexos I e III, ID.AR-6"
    text: "A entidade garante que as respostas aos riscos são identificadas e priorizadas."
    controls: [ID.AR-6-B, ID.AR-6-S, ID.AR-6-E]
  - id: QNRCS-ID.AR-7
    reference: "Regulamento 756/2026, anexos I e III, ID.AR-7"
    text: "A entidade define processos para receber informação, analisar e responder a vulnerabilidades provenientes de fontes internas e externas."
    controls: [ID.AR-7-B, ID.AR-7-S, ID.AR-7-E]
  - id: QNRCS-ID.MC-2
    reference: "Regulamento 756/2026, anexos I e III, ID.MC-2"
    text: "São identificadas melhorias a partir de testes e exercícios de cibersegurança."
    controls: [ID.MC-2-E]
  - id: QNRCS-ID.MC-3
    reference: "Regulamento 756/2026, anexos I e III, ID.MC-3"
    text: "As melhorias são identificadas a partir da execução de processos, procedimentos e atividades operacionais."
    controls: [ID.MC-3-B, ID.MC-3-S]
  - id: QNRCS-PR.GA-1
    reference: "Regulamento 756/2026, anexos I e III, PR.GA-1"
    text: "Os ciclos de vida de gestão de identidades são definidos"
    controls: [PR.GA-1-B, PR.GA-1-S, PR.GA-1-E]
  - id: QNRCS-PR.GA-2
    reference: "Regulamento 756/2026, anexos I e III, PR.GA-2"
    text: "A entidade verifica a identidade dos utilizadores e vincula-a às respetivas credenciais."
    controls: [PR.GA-2-S, PR.GA-2-E]
  - id: QNRCS-PR.GA-3
    reference: "Regulamento 756/2026, anexos I e III, PR.GA-3"
    text: "São definidos mecanismos de autenticação de utilizadores, dispositivos e outros ativos de sistemas de informação."
    controls: [PR.GA-3-B, PR.GA-3-S, PR.GA-3-E]
  - id: QNRCS-PR.GA-4
    reference: "Regulamento 756/2026, anexos I e III, PR.GA-4"
    text: "As afirmações de identidade são protegidas, transmitidas e verificadas."
    controls: [PR.GA-4-E]
  - id: QNRCS-PR.GA-5
    reference: "Regulamento 756/2026, anexos I e III, PR.GA-5"
    text: "As permissões de acesso, os direitos e as autorizações são definidas numa política, são geridas, aplicadas e atualizadas, e incorporam os princípios do menor privilégio e da separação de funções."
    controls: [PR.GA-5-B, PR.GA-5-S, PR.GA-5-E]
  - id: QNRCS-PR.GA-6
    reference: "Regulamento 756/2026, anexos I e III, PR.GA-6"
    text: "Os controlos de acesso físico a ativos da entidade são geridos, monitorizados e aplicados em função do risco."
    controls: [PR.GA-6-B, PR.GA-6-S, PR.GA-6-E]
  - id: QNRCS-PR.GA-7
    reference: "Regulamento 756/2026, anexos I e III, PR.GA-7"
    text: "A entidade gere os seus acessos remotos."
    controls: [PR.GA-7-B, PR.GA-7-S, PR.GA-7-E]
  - id: QNRCS-PR.FC-1
    reference: "Regulamento 756/2026, anexos I e III, PR.FC-1"
    text: "Todo o pessoal é sensibilizado e formado em matérias de cibersegurança."
    controls: [PR.FC-1-B, PR.FC-1-S, PR.FC-1-E]
  - id: QNRCS-PR.FC-2
    reference: "Regulamento 756/2026, anexos I e III, PR.FC-2"
    text: "O pessoal com funções especializadas em cibersegurança e os órgãos de gestão, direção e administração recebem formação adequada para o exercício das suas funções."
    controls: [PR.FC-2-B, PR.FC-2-S]
  - id: QNRCS-PR.SD-1
    reference: "Regulamento 756/2026, anexos I e III, PR.SD-1"
    text: "A entidade protege a confidencialidade, integridade e disponibilidade dos dados em repouso."
    controls: [PR.SD-1-S, PR.SD-1-E]
  - id: QNRCS-PR.SD-2
    reference: "Regulamento 756/2026, anexos I e III, PR.SD-2"
    text: "A entidade protege a confidencialidade, integridade e disponibilidade dos dados em trânsito."
    controls: [PR.SD-2-B, PR.SD-2-E]
  - id: QNRCS-PR.SD-3
    reference: "Regulamento 756/2026, anexos I e III, PR.SD-3"
    text: "A entidade implementa proteções que evitem exfiltração de dados."
    controls: [PR.SD-3-E]
  - id: QNRCS-PR.SD-4
    reference: "Regulamento 756/2026, anexos I e III, PR.SD-4"
    text: "A entidade protege a confidencialidade, integridade e disponibilidade dos dados em uso."
    controls: [PR.SD-4-E]
  - id: QNRCS-PR.SD-5
    reference: "Regulamento 756/2026, anexos I e III, PR.SD-5"
    text: "São realizadas, mantidas e testadas cópias de segurança dos dados da entidade."
    controls: [PR.SD-5-B, PR.SD-5-S, PR.SD-5-E]
  - id: QNRCS-PR.SP-1
    reference: "Regulamento 756/2026, anexos I e III, PR.SP-1"
    text: "É criada e mantida uma configuração base de redes e sistemas de informação que incorpora os princípios de segurança."
    controls: [PR.SP-1-B, PR.SP-1-S, PR.SP-1-E]
  - id: QNRCS-PR.SP-2
    reference: "Regulamento 756/2026, anexos I e III, PR.SP-2"
    text: "Os logs de sistemas e o histórico de atividades são documentados, implementados e revistos de acordo com as Políticas da entidade."
    controls: [PR.SP-2-B, PR.SP-2-S, PR.SP-2-E]
  - id: QNRCS-PR.SP-3
    reference: "Regulamento 756/2026, anexos I e III, PR.SP-3"
    text: "A instalação e execução de software não autorizado são impedidas."
    controls: [PR.SP-3-B]
  - id: QNRCS-PR.SP-4
    reference: "Regulamento 756/2026, anexos I e III, PR.SP-4"
    text: "É implementado um ciclo de vida de desenvolvimento seguro de software."
    controls: [PR.SP-4-S, PR.SP-4-E]
  - id: QNRCS-PR.RI-1
    reference: "Regulamento 756/2026, anexos I e III, PR.RI-1"
    text: "A entidade protege a integridade das redes de comunicações."
    controls: [PR.RI-1-B, PR.RI-1-S, PR.RI-1-E]
  - id: QNRCS-PR.RI-2
    reference: "Regulamento 756/2026, anexos I e III, PR.RI-2"
    text: "Os ambientes de desenvolvimento e de teste são separados de ambientes de produção."
    controls: [PR.RI-2-S]
  - id: QNRCS-PR.RI-3
    reference: "Regulamento 756/2026, anexos I e III, PR.RI-3"
    text: "Os ativos tecnológicos da entidade são protegidos de ameaças naturais."
    controls: [PR.RI-3-E]
  - id: QNRCS-PR.RI-4
    reference: "Regulamento 756/2026, anexos I e III, PR.RI-4"
    text: "São implementados mecanismos para cumprir os requisitos de resiliência em situações adversas."
    controls: [PR.RI-4-S]
  - id: QNRCS-PR.RI-5
    reference: "Regulamento 756/2026, anexos I e III, PR.RI-5"
    text: "A entidade planeia a capacidade adequada dos recursos para garantir a disponibilidade das suas redes e sistemas de informação."
    controls: [PR.RI-5-S]
  - id: QNRCS-DE.MC-1
    reference: "Regulamento 756/2026, anexos I e III, DE.MC-1"
    text: "As redes e sistemas de informação são monitorizados para detetar potenciais incidentes."
    controls: [DE.MC-1-B, DE.MC-1-S, DE.MC-1-E]
  - id: QNRCS-DE.MC-2
    reference: "Regulamento 756/2026, anexos I e III, DE.MC-2"
    text: "O ambiente físico é monitorizado para possibilitar a deteção de potenciais incidentes de segurança."
    controls: [DE.MC-2-S, DE.MC-2-E]
  - id: QNRCS-DE.MC-4
    reference: "Regulamento 756/2026, anexos I e III, DE.MC-4"
    text: "A entidade identifica e implementa mecanismos para deteção de código malicioso."
    controls: [DE.MC-4-B]
  - id: QNRCS-DE.MC-5
    reference: "Regulamento 756/2026, anexos I e III, DE.MC-5"
    text: "A utilização de aplicações não autorizadas em dispositivos móveis é detetada."
    controls: [DE.MC-5-B, DE.MC-5-S, DE.MC-5-E]
  - id: QNRCS-DE.MC-6
    reference: "Regulamento 756/2026, anexos I e III, DE.MC-6"
    text: "As atividades dos prestadores de serviços externos são monitorizadas para deteção de incidentes."
    controls: [DE.MC-6-S]
  - id: QNRCS-DE.MC-7
    reference: "Regulamento 756/2026, anexos I e III, DE.MC-7"
    text: "O hardware, software, os ambientes em produção e os seus dados são monitorizados para detetar eventos potencialmente adversos."
    controls: [DE.MC-7-S, DE.MC-7-E]
  - id: QNRCS-DE.AE-1
    reference: "Regulamento 756/2026, anexos I e III, DE.AE-1"
    text: "Os eventos detetados são analisados."
    controls: [DE.AE-1-S, DE.AE-1-E]
  - id: QNRCS-DE.AE-2
    reference: "Regulamento 756/2026, anexos I e III, DE.AE-2"
    text: "Os eventos são recolhidos e correlacionados a partir de várias fontes e sensores."
    controls: [DE.AE-2-B, DE.AE-2-E]
  - id: QNRCS-DE.AE-3
    reference: "Regulamento 756/2026, anexos I e III, DE.AE-3"
    text: "O impacto estimado e o âmbito dos eventos adversos detetados são compreendidos e identificados."
    controls: [DE.AE-3-E]
  - id: QNRCS-DE.AE-4
    reference: "Regulamento 756/2026, anexos I e III, DE.AE-4"
    text: "As informações sobre deteções de eventos são comunicadas."
    controls: [DE.AE-4-S]
  - id: QNRCS-DE.AE-6
    reference: "Regulamento 756/2026, anexos I e III, DE.AE-6"
    text: "Os critérios para a declaração de incidentes são definidos"
    controls: [DE.AE-6-B]
  - id: QNRCS-RS.GI-1
    reference: "Regulamento 756/2026, anexos I e III, RS.GI-1"
    text: "O Plano de Resposta a Incidentes é executado, em coordenação com as partes interessadas, durante ou após a ocorrência de um incidente."
    controls: [RS.GI-1-B, RS.GI-1-S]
  - id: QNRCS-RS.GI-2
    reference: "Regulamento 756/2026, anexos I e III, RS.GI-2"
    text: "As notificações dos sistemas de deteção são triadas e validadas."
    controls: [RS.GI-2-S]
  - id: QNRCS-RS.GI-3
    reference: "Regulamento 756/2026, anexos I e III, RS.GI-3"
    text: "Os incidentes são categorizados de acordo com o Plano de Resposta a Incidentes definido."
    controls: [RS.GI-3-S, RS.GI-3-E]
  - id: QNRCS-RS.GI-5
    reference: "Regulamento 756/2026, anexos I e III, RS.GI-5"
    text: "São aplicados os critérios para iniciar a recuperação de incidentes."
    controls: [RS.GI-5-S]
  - id: QNRCS-RS.AI-1
    reference: "Regulamento 756/2026, anexos I e III, RS.AI-1"
    text: "É realizada uma análise forense para determinar o que ocorreu durante um incidente e a sua causa raiz."
    controls: [RS.AI-1-E]
  - id: QNRCS-RS.AI-2
    reference: "Regulamento 756/2026, anexos I e III, RS.AI-2"
    text: "As ações realizadas durante uma investigação são registadas e a integridade e proveniência dos registos são preservadas."
    controls: [RS.AI-2-E]
  - id: QNRCS-RS.AI-3
    reference: "Regulamento 756/2026, anexos I e III, RS.AI-3"
    text: "Os dados e metadados do incidente são recolhidos, e a sua integridade e proveniência são preservadas."
    controls: [RS.AI-3-E]
  - id: QNRCS-RS.AI-4
    reference: "Regulamento 756/2026, anexos I e III, RS.AI-4"
    text: "O impacto do incidente é estimado e validado."
    controls: [RS.AI-4-E]
  - id: QNRCS-RS.NC-1
    reference: "Regulamento 756/2026, anexos I e III, RS.NC-1"
    text: "As partes interessadas internas e externas são notificadas dos incidentes."
    controls: [RS.NC-1-B, RS.NC-1-S]
  - id: QNRCS-RS.MI-1
    reference: "Regulamento 756/2026, anexos I e III, RS.MI-1"
    text: "Os incidentes são contidos."
    controls: [RS.MI-1-S]
  - id: QNRCS-RS.MI-2
    reference: "Regulamento 756/2026, anexos I e III, RS.MI-2"
    text: "Os incidentes são resolvidos."
    controls: [RS.MI-2-E]
  - id: QNRCS-RC.PR-1
    reference: "Regulamento 756/2026, anexos I e III, RC.PR-1"
    text: "A entidade segue um plano de recuperação durante ou após um incidente."
    controls: [RC.PR-1-B]
  - id: QNRCS-RC.PR-3
    reference: "Regulamento 756/2026, anexos I e III, RC.PR-3"
    text: "A integridade das cópias de segurança e de outros ativos de restauro é verificada antes da sua utilização."
    controls: [RC.PR-3-B]
  - id: QNRCS-RC.PR-5
    reference: "Regulamento 756/2026, anexos I e III, RC.PR-5"
    text: "A integridade dos ativos restaurados é verificada, os sistemas e serviços são restaurados e o estado de normal funcionamento é confirmado."
    controls: [RC.PR-5-S]
  - id: QNRCS-RC.PR-6
    reference: "Regulamento 756/2026, anexos I e III, RC.PR-6"
    text: "O fim da recuperação do incidente é documentado e declarado com base em critérios predefinidos."
    controls: [RC.PR-6-S]
  - id: QNRCS-RC.CO-1
    reference: "Regulamento 756/2026, anexos I e III, RC.CO-1"
    text: "As atividades de recuperação são comunicadas às partes interessadas, bem como aos órgãos de gestão, direção e administração."
    controls: [RC.CO-1-S]
  - id: QNRCS-RC.CO-2
    reference: "Regulamento 756/2026, anexos I e III, RC.CO-2"
    text: "As atualizações sobre a recuperação de incidentes são partilhadas utilizando métodos aprovados pela entidade."
    controls: [RC.CO-2-S, RC.CO-2-E]
  - id: RJC-27-1-a
    reference: "DL 125/2025, art. 27.º, n.º 1, al. a)"
