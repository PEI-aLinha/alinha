        text: "Os contratos com fornecedores incluem requisitos de cibersegurança e a forma de partilhar informação sensível?"
        explanation: "O contrato deve dizer o que o fornecedor tem de cumprir para proteger a informação da empresa."
        example: "O contrato com a empresa de manutenção informática obriga a avisar em 24 horas se houver um incidente."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.CA-5-E
