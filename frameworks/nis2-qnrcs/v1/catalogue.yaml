        text: "A empresa tem um sistema automático que junta, relaciona e analisa os eventos de segurança detetados?"
        explanation: "Um sistema automático relaciona eventos de várias origens que, vistos à parte, pareceriam inofensivos."
        example: "Uma plataforma (SIEM) que junta os registos da firewall, dos servidores e dos computadores."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.AE-2-B
    title: "Recolher e guardar os eventos de segurança"
