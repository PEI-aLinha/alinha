        explanation: "A política define como e com que frequência se procuram e registam as falhas dos sistemas mais importantes."
        example: "Uma política que manda verificar as vulnerabilidades dos servidores todos os meses e registar o resultado."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-1-E
    title: "Monitorização contínua e testes de intrusão"
    level: high
    technical: true
