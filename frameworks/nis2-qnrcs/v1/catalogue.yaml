        text: "Antes de usar uma cópia de segurança para recuperar de um incidente, a empresa verifica se ela está completa e não foi alterada?"
        explanation: "Uma cópia danificada ou infetada pode trazer o problema de volta."
        example: "Antes de repor a cópia, o técnico confirma que abre corretamente e que não tem ficheiros encriptados pelo ataque."
        answers: ["yes", "partial", "no", "unknown"]

