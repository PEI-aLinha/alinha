    controls: [GR.CO-6-B, GR.CA-1-E, GR.CA-3-S, GR.CA-5-S, GR.CA-5-E, GR.CA-6-E, GR.CA-7-B, GR.CA-7-S, GR.CA-7-E, GR.CA-8-S, GR.CA-8-E, ID.GA-4-B, DE.MC-6-S]
  - id: RJC-27-1-d
