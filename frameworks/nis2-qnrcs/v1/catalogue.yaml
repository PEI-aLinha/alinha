        text: "A empresa usa ferramentas que procuram vulnerabilidades nos seus ativos de forma contínua?"
        explanation: "Ferramentas automáticas detetam falhas novas assim que aparecem, sem esperar por uma verificação manual."
        example: "Um programa que analisa a rede todas as semanas e avisa quando encontra uma falha."
        answers: ["yes", "partial", "no", "unknown"]
