        example: "Uma empresa especializada faz um teste de intrusão por ano e entrega um relatório."
        answers: ["yes", "partial", "no", "unknown"]

  - id: ID.AR-4-B
    title: "Probabilidade e impacto das ameaças"
    level: basic
    technical: false
    evidence:
