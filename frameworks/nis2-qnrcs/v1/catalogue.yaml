        text: "A empresa contém e resolve os incidentes?"
        explanation: "Conter é impedir que o incidente se espalhe; resolver é eliminar a causa."
        example: "Um computador infetado é desligado da rede de imediato e limpo antes de voltar a ser usado."
        answers: ["yes", "partial", "no", "unknown"]
