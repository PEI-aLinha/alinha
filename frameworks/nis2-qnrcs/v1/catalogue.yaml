        explanation: "Os eventos reais mostram que riscos se estão a concretizar e quão graves podem ser."
        example: "Depois de várias tentativas de ataque ao site, o risco de paragem da loja online passa para prioridade alta."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.AE-4-S
    title: "Partilhar a informação sobre eventos"
