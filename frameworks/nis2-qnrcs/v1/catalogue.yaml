        explanation: "Os riscos dos fornecedores devem ser tratados como os restantes riscos da empresa, e não à parte."
        example: "O mapa de riscos da empresa inclui o risco de o fornecedor de alojamento ser atacado."
        answers: ["yes", "partial", "no", "unknown"]

  - id: GR.CA-5-S
    title: "Segurança nos contratos com fornecedores"
