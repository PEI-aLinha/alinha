    questions:
      - id: DE.AE-2-E-Q1
        text: "O sistema automático de análise de eventos considera as várias fontes e sensores dos ativos críticos?"
        explanation: "Quantas mais fontes, mais completa é a imagem do que se passa nos sistemas críticos."
        example: "O SIEM recebe registos da firewall, dos servidores, das aplicações e dos sensores de rede."
        answers: ["yes", "partial", "no", "unknown"]
      - id: DE.AE-2-E-Q2
        text: "Esse sistema integra também a informação das análises de vulnerabilidades e o desempenho dos sistemas e aplicações?"
        explanation: "Juntar as vulnerabilidades e o desempenho ajuda a perceber se um evento é um ataque a uma falha conhecida."
        example: "O SIEM cruza um alerta num servidor com uma vulnerabilidade conhecida desse servidor."
        answers: ["yes", "partial", "no", "unknown"]

  - id: DE.AE-3-E
    title: "Impacto dos eventos na gestão de riscos"
