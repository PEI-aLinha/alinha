# Staging: the production stack built from this checkout, on http://localhost:8088. Used to try a release
# before tagging it (make staging). Layered on top of docker-compose.prod.yml; values in deploy/.env.staging,
# created by `make staging-env`.
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ["127.0.0.1:8088:80"]

  bff:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args: { MODULE: bff }

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args: { MODULE: app }

  # Staging keeps OpenBao in dev mode (in memory, unsealed, root token from deploy/.env.staging): no init or unseal
  # to do, and the seed job fills it on every start like in production.
  openbao:
    # Straight to bao: the image's entrypoint would add the production -config, whose listener clashes with -dev's.
    entrypoint: ["bao", "server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    command: []
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_ROOT_TOKEN:?}

  keycloak:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.keycloak
      # Staging keeps the dev personas (deploy/keycloak/README.md); production has none.
      args: { TEST_USERS: "true" }
    environment:
      ALINHA_TEST_USER_PASSWORD: ${ALINHA_TEST_USER_PASSWORD:?}

  job-consumer:
    build:
      context: ..
      dockerfile: workers/job_consumer/Dockerfile
