# The shell (SPA) only: Keycloak's pages under /kc/ have their own inline scripts and must not get this CSP.
# add_header in a location drops the server-level ones, so this includes them again.
include /etc/nginx/snippets/security-headers.conf;
# Everything the shell loads is same-origin (Vite bundles, /api through the BFF, the login redirect to /kc/).
# 'unsafe-inline' for styles only: React's style attributes. No inline or third-party script is ever allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
