# Local development dependencies: docker compose -f deploy/docker-compose.dev.yml up -d
# The app runs outside Docker (./gradlew :app:bootRun) and the frontend with pnpm dev.
# TODO sprint 0 (RNF21): full docker-compose.yml with Nginx, BFF, app, AI Service,
# workers and OpenBao, starting with a single command.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: alinha
      POSTGRES_USER: alinha
      POSTGRES_PASSWORD: alinha
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:8
    ports: ["6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]

  # Secrets (NFR09). Dev mode: in-memory, unsealed, KV v2 at secret/. Data is lost on restart;
  # openbao-init re-seeds it. Dev-only token below; never use dev mode outside local development.
  openbao:
    image: openbao/openbao:2.4.1
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

  openbao-init:
    image: openbao/openbao:2.4.1
    depends_on: [openbao]
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: dev-root-token
    volumes: [./openbao:/init:ro]
    restart: "no"

volumes:
  pgdata:
