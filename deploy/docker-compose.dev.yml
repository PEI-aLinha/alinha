# Local development dependencies: docker compose -f deploy/docker-compose.dev.yml up -d
# The app runs outside Docker (./gradlew :app:bootRun) and the frontend with pnpm dev.
# Dev-only credentials below are the defaults; override them in deploy/.env
# (see deploy/.env.example). Never put real secrets in this file.
# TODO sprint 0 (RNF21): full docker-compose.yml with Nginx, BFF, app, AI Service,
# workers and OpenBao, starting with a single command.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alinha}
      POSTGRES_USER: ${POSTGRES_USER:-alinha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alinha}
      # runtime role, see postgres/init (fresh volume only)
      ALINHA_APP_DB_PASSWORD: ${ALINHA_APP_DB_PASSWORD:-alinha_app}
    healthcheck:
      # TCP, not the unix socket: the temporary initdb server only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8
    # AOF, fsync on every write: a job the outbox marked `published` must survive a Redis crash (RNF02, docs/jobs.md).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redisdata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    # The image has no curl, so the shell's /dev/tcp reads the management port directly.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q ^HTTP/1.1.200 <&3"]
      interval: 5s
      timeout: 3s
      retries: 40
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # aLinha login theme (frontend/keycloak-theme): `pnpm --filter @alinha/keycloak-theme build-keycloak-theme`.
      # Without the jar, Keycloak falls back to its own theme.
      - ../frontend/keycloak-theme/dist_keycloak:/opt/keycloak/providers:ro
    depends_on: [mailpit]

  # Catches every email the app and Keycloak send. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  # Secrets (NFR09). Dev mode: in-memory, unsealed, KV v2 at secret/. Data is lost on restart;
  # openbao-init re-seeds it. Dev-only token below; never use dev mode outside local development.
  openbao:
    image: openbao/openbao:2.4.1
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token
    cap_add: [IPC_LOCK]
    ports: ["127.0.0.1:8200:8200"] # dev root token is public: never expose beyond localhost

  openbao-init:
    image: openbao/openbao:2.4.1
    depends_on: [openbao]
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: dev-root-token
      # Same values as the postgres service, so the seeded db.* secrets follow deploy/.env.
      POSTGRES_USER: ${POSTGRES_USER:-alinha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alinha}
      ALINHA_APP_DB_PASSWORD: ${ALINHA_APP_DB_PASSWORD:-alinha_app}
    volumes: [./openbao:/init:ro]
    restart: "no"

volumes:
  pgdata:
  redisdata:
