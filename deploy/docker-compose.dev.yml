# Dependências para desenvolvimento local: docker compose -f deploy/docker-compose.dev.yml up -d
# A app corre fora do Docker (./gradlew :app:bootRun) e o frontend com pnpm dev.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: alinha
      POSTGRES_USER: alinha
      POSTGRES_PASSWORD: alinha
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:8
    ports: ["6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]

volumes:
  pgdata:
