# Worker runtime: reads jobs from Redis Streams and dispatches them to provider collectors.
[project]
name = "alinha-job-consumer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format]>=4.20",
    "redis>=5",
]

[project.optional-dependencies]
test = [
    "fakeredis>=2.23",
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
alinha-job-consumer = "alinha_job_consumer.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
