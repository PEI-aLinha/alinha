name: Build & Publish to GHCR

# A release tag (vX.Y.Z) builds every production image and pushes it as X.Y.Z, X.Y, X and latest.
# Deploy with .github/workflows/deploy.yml. See deploy/DEPLOYMENT.md.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/pei-alinha/alinha

jobs:
  build:
    name: Build & Push ${{ matrix.image }}
    # The production VM is aarch64: build natively on GitHub's ARM runners (no QEMU).
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            file: deploy/Dockerfile.backend
            build-args: MODULE=app
          - image: bff
            file: deploy/Dockerfile.backend
            build-args: MODULE=bff
          - image: web
            file: deploy/Dockerfile.web
          - image: keycloak
            file: deploy/Dockerfile.keycloak
          - image: job-consumer
            file: workers/job_consumer/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}   # read-only PAT for the plugin repos
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
