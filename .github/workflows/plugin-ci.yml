# CI of one plugin, called by .github/workflows/ci.yml in every plugin repo (and alinha-plugin-template):
#
#   jobs:
#     ci:
#       uses: PEI-aLinha/alinha/.github/workflows/plugin-ci.yml@main
#       with:
#         plugin-path: plugins/feature/<id>
#         gradle-project: <id>
#         npm-package: "@alinha/plugin-<id>"
#       secrets: inherit   # ALINHA_READ_TOKEN, SONAR_TOKEN
#
# It tests the plugin inside the main repo (core + every other plugin), with the plugin's commit in place of
# its submodule, then sends the analysis and the coverage to the plugin's SonarCloud project
# (<owner>_<plugin repo>). That project must have Automatic Analysis OFF: it cannot import coverage and it
# conflicts with this CI analysis. A sonar-project.properties in the plugin root may add or override settings.
name: Plugin CI

on:
  workflow_call:
    inputs:
      plugin-path:
        description: Submodule path in the main repo, e.g. plugins/feature/organization
        required: true
        type: string
      gradle-project:
        description: Gradle project name (the plugin id), e.g. organization
        required: true
        type: string
      npm-package:
        description: Frontend package name, e.g. "@alinha/plugin-organization"
        required: true
        type: string
      main-ref:
        description: Branch of the main repo to test against. Only for a coordinated change across repos
          (README procedure for plugin-api/contracts), where the plugin branch needs the main repo's branch
          of the same name. Use the same ref in `uses:` so the steps match the checkout.
        required: false
        type: string
        default: main
    secrets:
      ALINHA_READ_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # SonarCloud PR decoration
    env:
      PLUGIN_PATH: ${{ inputs.plugin-path }}
      GRADLE_PROJECT: ${{ inputs.gradle-project }}
      NPM_PACKAGE: ${{ inputs.npm-package }}
    steps:
      - name: Check out the main repo with every plugin
        uses: actions/checkout@v4
        with:
          repository: PEI-aLinha/alinha
          ref: ${{ inputs.main-ref }}
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}   # only needed for private repos

      # Full history of the plugin: SonarCloud needs blame data and the PR's target branch for new code.
      - name: Put this commit in place of the submodule
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd "$PLUGIN_PATH"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch -q --unshallow origin; fi
          git fetch -q origin "$SHA"
          git checkout -q --detach "$SHA"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
      # Kover is applied to every plugin by the main repo's build.gradle.kts.
      - name: Backend + module verification + coverage
        run: ./gradlew ":$GRADLE_PROJECT:build" ":$GRADLE_PROJECT:koverXmlReport" :app:test

      # No version: it reads packageManager in the main repo's package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend
        run: |
          pnpm install
          pnpm gen:plugins
          pnpm --filter "$NPM_PACKAGE" typecheck
          pnpm lint
      # Thresholds come from the plugin's vitest.config.ts; its lcov reporter writes frontend/coverage/lcov.info.
      - name: Frontend tests + coverage
        if: hashFiles(format('{0}/frontend/vitest.config.ts', inputs.plugin-path)) != ''
        run: pnpm --filter "$NPM_PACKAGE" exec vitest run --coverage

      - uses: actions/setup-python@v5
        if: hashFiles(format('{0}/worker/pyproject.toml', inputs.plugin-path)) != ''
        with:
          python-version: "3.12"
      # Locked, hashed wheels only, and the worker itself is not installed: no setup scripts run (same as
      # workers/ in the main repo). A worker with runtime dependencies adds its own hashed
      # worker/requirements-test.txt, installed the same way.
      - name: Worker (providers) + coverage
        if: hashFiles(format('{0}/worker/pyproject.toml', inputs.plugin-path)) != ''
        working-directory: ${{ inputs.plugin-path }}/worker
        run: |
          python -m pip install -q --only-binary :all: --require-hashes \
            -r "$GITHUB_WORKSPACE/.github/plugin-ci/worker-requirements-test.txt"
          if [ -f requirements-test.txt ]; then
            python -m pip install -q --only-binary :all: --require-hashes -r requirements-test.txt
          fi
          PYTHONPATH=src python -m pytest -q --cov=src --cov-report=term --cov-report=xml

      # Only the folders that exist: a plugin without a worker (or without tests yet) still gets analysed.
      - name: SonarCloud settings
        id: sonar
        working-directory: ${{ inputs.plugin-path }}
        run: |
          existing() { local found=() d; for d in "$@"; do [ -d "$d" ] && found+=("$d"); done; local IFS=,; echo "${found[*]}"; }
          echo "sources=$(existing backend/src/main frontend/src worker/src)" >> "$GITHUB_OUTPUT"
          echo "tests=$(existing backend/src/test frontend/src worker/tests)" >> "$GITHUB_OUTPUT"

      # Dependabot and fork PRs get no SONAR_TOKEN; skip instead of failing them (secrets cannot be read in `if`).
      # v8.4.1, pinned by commit (same as the main repo's job "sonar").
      - name: SonarCloud (analysis + coverage)
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.plugin-path }}
          args: >
            -Dsonar.organization=pei-alinha
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.sources=${{ steps.sonar.outputs.sources }}
            -Dsonar.tests=${{ steps.sonar.outputs.tests }}
            -Dsonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
            -Dsonar.test.inclusions=backend/src/test/**,worker/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
            -Dsonar.java.binaries=backend/build/classes/kotlin/main
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/build/reports/kover/report.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.python.coverage.reportPaths=worker/coverage.xml
            -Dsonar.python.version=3.12
            -Dsonar.sourceEncoding=UTF-8
