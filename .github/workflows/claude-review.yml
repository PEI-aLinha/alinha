name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # Reusable from the plugin/provider repos so the review prompt lives in one place.
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Skip drafts and PRs from forks (forks don't receive repository secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          # OAuth token from a Claude Pro/Max subscription, generated with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:
            - Correctness bugs and unhandled edge cases
            - Security: tenant isolation (no cross-tenant reads/writes), auth, input validation
            - Spring Modulith boundaries between core and plugins
            - Missing or weak tests for the changed behaviour

            Use `gh pr diff` and `gh pr view` to read the change. Read CLAUDE.md and docs/
            for project conventions when relevant.
            Post specific issues as inline comments on the affected lines, then post one
            short summary comment on the PR with `gh pr comment`.
            Skip style nits that a formatter or linter would catch. If nothing material
            is found, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
