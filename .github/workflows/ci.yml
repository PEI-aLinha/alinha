name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI directly (gitleaks-action requires a GITLEAKS_LICENSE key on organisation repos). Image pinned by digest.
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  submodules:
    name: Submodule pointers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}   # read-only PAT for the plugin repos
      - run: ./scripts/check-submodules.sh

  backend:
    name: Backend (core + plugins + Modulith verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  frontend:
    name: Frontend (shell + plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
