name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deploy:
    name: Dev environment (compose + realm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-dev-env.mjs
      # The web image's Nginx: the admin console, the master realm and Keycloak's metrics stay 404, the shell gets its CSP.
      - run: sh deploy/nginx/test-routes.sh
      # The production and staging compose files interpolate, and deploy.yml sets every variable they require.
      - run: sh deploy/test-compose.sh
      # Production's OpenBao path: a real server, bootstrap, then the seed job with the narrow alinha-seed token.
      - run: sh deploy/openbao/test-seed.sh

  images:
    name: Image ${{ matrix.image }} (build, no push)
    # Same runner and platform as publish.yml, so a release never meets a Dockerfile that does not build.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            file: deploy/Dockerfile.backend
            build-args: MODULE=app
          - image: bff
            file: deploy/Dockerfile.backend
            build-args: MODULE=bff
          - image: web
            file: deploy/Dockerfile.web
          - image: keycloak
            file: deploy/Dockerfile.keycloak
          - image: job-consumer
            file: workers/job_consumer/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          build-args: ${{ matrix.build-args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          # Only main writes the cache, which publish.yml then reads on the release tag.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI directly (gitleaks-action requires a GITLEAKS_LICENSE key on organisation repos). Image pinned by digest.
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  submodules:
    name: Submodule pointers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}   # read-only PAT for the plugin repos
      - run: ./scripts/check-submodules.sh

  backend:
    name: Backend (core + plugins + Modulith verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  frontend:
    name: Frontend (shell + plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - name: API client matches contracts/openapi/alinha.yaml
        run: pnpm check:api
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  workers:
    name: Workers (job consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "workers/job_consumer[test]"
      - run: pytest --cov=alinha_job_consumer --cov-fail-under=70
        working-directory: workers/job_consumer

  frameworks:
    name: Framework catalogues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install check-jsonschema==0.39.0
      - run: ./scripts/validate-frameworks.sh

  immutable-frameworks:
    name: Immutable framework versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-immutable-frameworks.sh
