name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deploy:
    name: Dev environment (compose + realm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-dev-env.mjs

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI directly (gitleaks-action requires a GITLEAKS_LICENSE key on organisation repos). Image pinned by digest.
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  submodules:
    name: Submodule pointers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}   # read-only PAT for the plugin repos
      - run: ./scripts/check-submodules.sh

  backend:
    name: Backend (core + plugins + Modulith verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  frontend:
    name: Frontend (shell + plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - name: API client matches contracts/openapi/alinha.yaml
        run: pnpm check:api
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  ai-service:
    name: AI Service (pytest + coverage + Docker image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4   # tests read contracts/ai, so the whole repo is needed
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.5            # same as the Dockerfile
          python-version: "3.12"
      - run: uv sync --locked --extra dev   # fails if uv.lock is out of date with pyproject.toml
      - run: uv run pytest --cov --cov-report=term-missing   # fail_under in pyproject.toml (RNF19)
      - run: docker build -t alinha-ai-service:ci .
  workers:
    name: Workers (job consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "workers/job_consumer[test]"
      - run: pytest --cov=alinha_job_consumer --cov-fail-under=70
        working-directory: workers/job_consumer

  frameworks:
    name: Framework catalogues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install check-jsonschema==0.39.0
      - run: ./scripts/validate-frameworks.sh

  immutable-frameworks:
    name: Immutable framework versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-immutable-frameworks.sh
