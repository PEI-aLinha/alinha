name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deploy:
    name: Dev environment (compose + realm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-dev-env.mjs

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI directly (gitleaks-action requires a GITLEAKS_LICENSE key on organisation repos). Image pinned by digest.
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  submodules:
    name: Submodule pointers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}   # read-only PAT for the plugin repos
      - run: ./scripts/check-submodules.sh

  backend:
    name: Backend (core + plugins + Modulith verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
      - run: ./gradlew build koverXmlReport koverVerify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-backend
          path: build/reports/kover/report.xml
          retention-days: 1
      # The Java/Kotlin analysers need the compiled classes (sonar.java.binaries); plugins are analysed in their repos.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: classes-backend
          path: |
            backend/*/build/classes/
            bff/build/classes/
          retention-days: 1

  frontend:
    name: Frontend (shell + plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ALINHA_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - name: API client matches contracts/openapi/alinha.yaml
        run: pnpm check:api
      - run: pnpm lint
      - run: pnpm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-frontend
          path: |
            frontend/shell/coverage/lcov.info
            frontend/packages/*/coverage/lcov.info
            frontend/keycloak-theme/coverage/lcov.info
          retention-days: 1
      - run: pnpm typecheck
      - run: pnpm build

  workers:
    name: Workers (job consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Locked, hashed wheels only: no setup scripts run (pytest finds the package through `pythonpath`).
      - run: pip install --only-binary :all: --require-hashes -r workers/job_consumer/requirements-test.txt
      # coverage.xml has the absolute source dir of the runner workspace, which is the same path in the sonar job.
      - run: pytest --cov=alinha_job_consumer --cov-fail-under=70 --cov-report=term --cov-report=xml
        working-directory: workers/job_consumer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-workers
          path: workers/job_consumer/coverage.xml
          retention-days: 1

  sonar:
    name: SonarCloud (analysis + coverage)
    needs: [backend, frontend, workers]
    # Dependabot and fork PRs get no SONAR_TOKEN; skip instead of failing them (secrets cannot be read in `if`).
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # PR decoration
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # blame data for new-code detection
      # Reports keep the paths the test jobs wrote them to (see sonar-project.properties).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: coverage-backend
          path: build/reports/kover
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: classes-backend
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: coverage-frontend
          path: frontend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: coverage-workers
          path: workers/job_consumer
      # v8.4.1, pinned by commit.
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frameworks:
    name: Framework catalogues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install check-jsonschema==0.39.0
      - run: ./scripts/validate-frameworks.sh

  immutable-frameworks:
    name: Immutable framework versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-immutable-frameworks.sh
