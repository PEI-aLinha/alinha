packages:
  - frontend/shell
  - frontend/packages/*
  # Keycloak login theme (Keycloakify), built into a jar for the dev stack
  - frontend/keycloak-theme
  # each plugin's frontend (submodules)
  - plugins/*/*/frontend
# Dependency install scripts that pnpm may run. tsparticles' only warns about legacy particle packages.
allowBuilds:
  '@tsparticles/engine': false
