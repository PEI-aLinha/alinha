openapi: 3.1.0

info:
  title: aLinha API
  version: 1.0.0
  description: |
    Public HTTP contract of aLinha, shared by the BFF, the frontend and the application.
    Every path is reached through the BFF under `/api`, using the BFF session cookie.

    Conventions are documented in `contracts/openapi/README.md` and decided in
    `docs/adr/0003-openapi-contract-first.md`.

    - The tenant never appears in the URL, query or body. It comes from the token and,
      for consultants, from the `X-Alinha-Tenant` header (ADR 0002).
    - Errors use RFC 9457 Problem Details (`application/problem+json`).
    - Lists use page-based pagination (`page`, `pageSize`, `items`, `total`).

servers:
  - url: /
    description: Same origin, through the BFF

tags:
  - name: session
    description: Who is signed in (owned by the BFF).
  - name: registry
    description: Plugins present in the running application.
  - name: organization
    description: The client organization's registration and data (organization plugin).
  - name: assessment
    description: Questionnaires adapted to the organization's regulatory scope (assessment plugin).
  - name: dashboard-reports
    description: Dashboards and reports (dashboard-reports plugin).
  - name: risk-assets
    description: Asset inventory and ISO/IEC 27005 risk register (risk-assets plugin).
  - name: code-repository
    description: Read-only connection to the organization's code repositories and the evidence collected (code-repository provider).
  - name: audit
    description: Who did what and when in the current organization (core audit trail).
  - name: internal
    description: Walking-skeleton endpoints. Temporary; remove when the real endpoint exists.

security:
  - sessionCookie: []

paths:
  /api/me:
    get:
      tags: [session]
      operationId: getMe
      summary: Who is signed in
      description: |
        Returns the current user, roles, `<resource>:<action>` permissions and the organizations
        the user may work on. `401` when there is no session; `/api/**` never answers a redirect.
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/plugins:
    get:
      tags: [registry]
      operationId: listPlugins
      summary: List the plugins present in the build
      responses:
        '200':
          description: >
            Every plugin manifest, sorted by id. `nav` holds only the menu entries
            the caller's roles may see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PluginManifest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/organization/registration:
    post:
      tags: [organization]
      operationId: registerOrganization
      summary: Register the caller's organization
      description: |
        A new account (`registrant` role, no organization yet) registers its organization. This creates the
        organization's tenant, makes the caller its Designated Officer (`responsible`) and publishes
        `OrganizationRegistered` (ADR 0004). The session must be refreshed afterwards to work inside the
        new organization. No `X-Alinha-Tenant`: the organization does not exist yet. Permission
        `organization:register`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationProfileInput'
      responses:
        '201':
          description: Organization registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `code` tells the cases apart:
            - `ORGANIZATION_ALREADY_EXISTS`: this account already has an organization (refresh the session and go to it);
            - `NIF_ALREADY_REGISTERED`: another organization already uses this NIF.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid data; `errors` has one Portuguese message per field (`code` = `VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            Too many registration attempts from this client (`code` = `TOO_MANY_REGISTRATIONS`): at most 5 per hour.
            Nothing was created. A second submit while this account's registration is still running is a `503`
            `REGISTRATION_BUSY` instead, and does not count as an attempt.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |
            Nothing was created; try again later. `code` tells why:
            - `IDENTITY_UNAVAILABLE`: the identity provider failed;
            - `REGISTRATION_BUSY`: too many registrations at once, or this account's registration is still running.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/organization/profile:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [organization]
      operationId: getOrganizationProfile
      summary: The current organization's data
      description: Permission `organization:read` (Designated Officer, consultant, analyst).
      responses:
        '200':
          description: The organization's data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [organization]
      operationId: updateOrganizationProfile
      summary: Update the current organization's data
      description: |
        Replaces the organization's data. `version` must be the one that was read; otherwise the answer is
        `409` (`code` = `VERSION_CONFLICT`) and nothing changes. The NIF identifies the organization and cannot
        change after registration: a different `nif` is a `422`. Permission `organization:edit`
        (Designated Officer, consultant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationProfileUpdate'
      responses:
        '200':
          description: The updated data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The data changed since it was read (`code` = `VERSION_CONFLICT`): reload and edit again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/organization/members:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [organization]
      operationId: listMembers
      summary: Everyone with an account in the current organization
      description: |
        The Designated Officer first, then the analysts by name (organization#6, ADR 0007). Consultants are not
        members: they are assigned. Not paginated: an SME's team is a handful of people. Permission `member:read`
        (Designated Officer).
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The identity provider did not answer (`code` = `IDENTITY_UNAVAILABLE`), with `Retry-After`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/organization/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: memberId
        in: path
        required: true
        description: The member's `id` from `listMembers`.
        schema:
          type: string
          maxLength: 255
    delete:
      tags: [organization]
      operationId: removeMember
      summary: Remove an analyst from the organization
      description: |
        The analyst loses access to the organization and their sessions end; what they recorded stays. Their account
        stays too, as a new account that may be invited again. The Designated Officer cannot be removed, and an id
        that is not an analyst of this organization is a `404` (`code` = `MEMBER_NOT_FOUND`). Audited. Permission
        `member:manage` (Designated Officer).
      responses:
        '204':
          description: The analyst was removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The identity provider did not answer (`code` = `IDENTITY_UNAVAILABLE`); nothing changed.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/organization/invitations:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [organization]
      operationId: listInvitations
      summary: The current organization's pending invitations
      description: |
        Not accepted and not cancelled, newest first. Expired ones stay listed (`expired`), so they can be sent
        again. The secret is never listed. Permission `member:read` (Designated Officer).
      responses:
        '200':
          description: The pending invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [organization]
      operationId: inviteAnalyst
      summary: Invite an analyst by email
      description: |
        Creates a single-use invitation, valid for 7 days and bound to `email` (ADR 0007). Inviting the same email
        again cancels the pending invitation, so this is also how an invitation is sent again. The response carries
        `token` **once**: the link is `/onboarding/invitation#<token>` (in the fragment, so it never reaches a server
        log). Until the invitation email exists (notifications#3) the page shows the link to copy.

        An email that already has an account in this organization is a `409` (`code` = `ALREADY_MEMBER`); an invalid
        one is a `422` (`code` = `INVALID_EMAIL`, field `email`). Audited. Permission `member:manage` (Designated
        Officer).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: The invitation, with its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: This email already has an account in the organization (`code` = `ALREADY_MEMBER`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: |
            The identity provider did not answer while checking the team (`code` = `IDENTITY_UNAVAILABLE`); no
            invitation was created.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/organization/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [organization]
      operationId: cancelInvitation
      summary: Cancel a pending invitation
      description: |
        The link stops working. An id that is not a pending invitation of this organization is a `404`
        (`code` = `INVITATION_NOT_FOUND`). Audited. Permission `member:manage` (Designated Officer).
      responses:
        '204':
          description: The invitation was cancelled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organization/invitations/accept:
    post:
      tags: [organization]
      operationId: acceptInvitation
      summary: Join the organization that invited the signed-in account
      description: |
        Called from the onboarding by a new account (`registrant`, no organization) whose verified email is the
        invited one (ADR 0007). No `X-Alinha-Tenant`: the organization comes from the invitation. The account joins
        as an analyst; the session is stale until the client calls `reauthenticate()`. Audited.

        `code` on failure: `INVITATION_NOT_FOUND` (404: unknown or cancelled), `INVITATION_FOR_ANOTHER_EMAIL` (403),
        `INVITATION_ALREADY_USED` (409), `INVITATION_EXPIRED` (410), `ORGANIZATION_ALREADY_EXISTS` (409: the account
        already has an organization), `TOO_MANY_REGISTRATIONS` (429), `REGISTRATION_BUSY` or `IDENTITY_UNAVAILABLE`
        (503); 429 and 503 carry `Retry-After`. Permission `invitation:accept` (registrant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '204':
          description: The account joined the organization.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            With `code` = `INVITATION_FOR_ANOTHER_EMAIL`: the invitation is for another email. Without a `code`: the
            account cannot accept at all, because it is not a new account (`registrant`), its email is not verified
            yet, or its token has no email or subject. The page then tells the person to verify their email and sign
            in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The invitation expired (`code` = `INVITATION_EXPIRED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          description: Too many attempts from this client (`code` = `TOO_MANY_REGISTRATIONS`).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Try again later (`REGISTRATION_BUSY`, `IDENTITY_UNAVAILABLE`).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/organization/scope:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [organization]
      operationId: getOrganizationScope
      summary: Regulatory scope and NIS2 classification of the current organization
      description: |
        The applicability answers, the frameworks that apply (NIS2, GDPR, AI Act) with plain-language
        explanations, the indicative NIS2 classification and the official CNCS qualification, if registered.
        `result` is computed on every read from the current answers and organization data with the core
        applicability rules (`docs/applicability.md`), so a later change to the number of employees or the
        turnover shows at once; `rulesVersion` says which rules produced it (NFR05). The result is indicative:
        once registered, the CNCS qualification is the one that counts (`nis2`). Permission `organization:read`
        (Designated Officer, consultant, analyst). `404` (`code` = `ORGANIZATION_NOT_REGISTERED`) before the
        organization registers.
      responses:
        '200':
          description: The organization's regulatory scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationScope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organization/scope/answers:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    put:
      tags: [organization]
      operationId: saveApplicabilityAnswers
      summary: Save the applicability answers
      description: |
        Replaces the organization's applicability answers. The first save sends no `version`; later saves send
        the `version` that was read, otherwise the answer is `409` (`code` = `VERSION_CONFLICT`) and nothing
        changes. Contradictory answers are a `422` with one error per field. Saving the same answers changes
        nothing. Permission `organization:edit` (Designated Officer, consultant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicabilityAnswersUpdate'
      responses:
        '200':
          description: The regulatory scope with the new answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationScope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The answers changed since they were read (`code` = `VERSION_CONFLICT`): reload and answer again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/organization/scope/qualification:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    put:
      tags: [organization]
      operationId: registerCncsQualification
      summary: Register or correct the official CNCS qualification
      description: |
        Registers the classification in the CNCS Qualification Act (Ato de Qualificação), which the CNCS
        issues after the organization registers on MyCiber. From then on it overrides the indicative
        classification. The first registration sends no `version`; a correction sends the `version` that was
        read, otherwise `409` (`code` = `VERSION_CONFLICT`). `actDate` cannot be in the future (Europe/Lisbon)
        nor before 2025-12-04, when Decree-Law 125/2025 was published. Permission `organization:edit`
        (Designated Officer, consultant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CncsQualificationUpdate'
      responses:
        '200':
          description: The regulatory scope with the official qualification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationScope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The qualification changed since it was read (`code` = `VERSION_CONFLICT`): reload and try again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/assessment/assessments:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    post:
      tags: [assessment]
      operationId: startAssessment
      summary: Start an assessment of one framework
      description: |
        Starts a `draft` assessment on the newest catalogue version of `framework` (assessment#2, FR07, US13).
        The catalogue version and the highest compliance level asked are fixed when the assessment starts:
        a newer catalogue never changes the questions of an existing assessment (NFR05, NFR18).

        The questions are cut to the scope computed from `scope` with the core applicability rules. For
        `nis2-qnrcs`, the NIS2 classification sets `maxLevel`; other frameworks get every level.
        The submitted `scope` is stored with the assessment, together with `rulesVersion`, so it can be
        checked later. The classification is indicative and self-declared: the consultant confirms it.

        At most one open (not `validated`) assessment per framework: a second one is a `409`
        (`code` = `ASSESSMENT_ALREADY_OPEN`, with `assessmentId` of the open one). Permission
        `assessment:start` (Designated Officer).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAssessmentRequest'
      responses:
        '201':
          description: The new assessment, with its questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            An assessment of this framework is already open (`code` = `ASSESSMENT_ALREADY_OPEN`).
            `assessmentId` is the open one: continue it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AssessmentAlreadyOpenProblem'
        '422':
          description: |
            `code` is one of:
            - `VALIDATION_FAILED`: invalid or contradictory `scope` answers, or unknown `framework` format.
            - `FRAMEWORK_NOT_IN_SCOPE`: by the `scope` answers, the framework does not apply.
            - `CATALOGUE_NOT_FOUND`: there is no catalogue for this framework yet.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [assessment]
      operationId: listAssessments
      summary: The current organization's assessments
      description: |
        Most recently worked on first (`updatedAt` descending), so the user can resume where they stopped.
        Permission `assessment:read` (Designated Officer, analyst, consultant).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of assessments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/assessment/assessments/{assessmentId}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [assessment]
      operationId: getAssessment
      summary: One assessment with its questions and saved answers
      description: |
        The questions come from the catalogue version fixed at start, with the answers saved so far.
        An id of another organization is a `404` (`code` = `ASSESSMENT_NOT_FOUND`).
        Permission `assessment:read`.
      responses:
        '200':
          description: The assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assessment/assessments/{assessmentId}/answers/{questionId}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/AssessmentId'
      - name: questionId
        in: path
        required: true
        description: Question id from the catalogue, e.g. `GV.OC-01-Q1`.
        schema:
          type: string
          maxLength: 100
          pattern: '^[A-Z0-9]+([.-][A-Za-z0-9]+)*$'
    put:
      tags: [assessment]
      operationId: saveAnswer
      summary: Save the answer to one question
      description: |
        Saves one answer (autosave). Idempotent: sending the value already saved changes nothing, keeps
        `answeredAt` and writes no audit entry. Every real change is audited with the previous and the
        new value (NFR04).

        Answers can only change while the assessment is `draft`; otherwise `409`
        (`code` = `ASSESSMENT_NOT_EDITABLE`). A value the question does not offer is a `422`
        (`code` = `VALIDATION_FAILED`, field `answer`). Permission `assessment:answer`
        (Designated Officer, analyst).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
      responses:
        '200':
          description: The saved answer and the new progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            `code` is `ASSESSMENT_NOT_FOUND` (no such assessment in this organization) or
            `QUESTION_NOT_IN_ASSESSMENT` (the question exists but is not part of this assessment).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The assessment was already submitted (`code` = `ASSESSMENT_NOT_EDITABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/assessment/assessments/{assessmentId}/submit:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/AssessmentId'
    post:
      tags: [assessment]
      operationId: submitAssessment
      summary: Submit the assessment and compute its results
      description: |
        Freezes the answers and has the Compliance Engine compute the results, in one transaction
        (assessment#5, FR10, US15): the assessment goes `draft` -> `submitted` -> `evaluated`, both steps are
        audited (NFR04) and publish `AssessmentSubmitted` and `AssessmentEvaluated`.

        Every question must have an answer (`unknown` counts as one); otherwise `422`
        (`code` = `ASSESSMENT_INCOMPLETE`, with the ids in `unanswered`). An assessment that is not `draft` is a `409`
        (`code` = `ASSESSMENT_NOT_EDITABLE`). Permission `assessment:submit` (Designated Officer).

        The response does not carry the results: the client sees them only after the consultant validates them
        (`getAssessmentResults`).
      responses:
        '200':
          description: The assessment, now `evaluated`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The assessment was already submitted (`code` = `ASSESSMENT_NOT_EDITABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Some questions have no answer (`code` = `ASSESSMENT_INCOMPLETE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AssessmentIncompleteProblem'

  /api/assessment/assessments/{assessmentId}/results:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [assessment]
      operationId: getAssessmentResults
      summary: The results the Compliance Engine computed for one assessment
      description: |
        Current and target level, and the status of every control, as computed on submit (NFR05: deterministic
        rules over the catalogue and the answers, never an LLM). Stored with the assessment, so they never change
        when the rules or the catalogue do.

        Permission `assessment:review` (consultant): the consultant reviews the results before the client sees
        them. Client access after validation comes with assessment#8, as an additive change.
        A `draft` or `submitted` assessment has no results yet: `409` (`code` = `RESULTS_NOT_AVAILABLE`).
      responses:
        '200':
          description: The results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Not evaluated yet (`code` = `RESULTS_NOT_AVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/dashboard-reports/portfolio:
    get:
      tags: [dashboard-reports]
      operationId: getPortfolioSummary
      summary: Compliance summary of every client in the consultant's portfolio
      description: |
        One entry per client organization in the token's `tenants` claim that has data, for the consultant's portfolio
        dashboard (dashboard-reports#3, FR26, US08). Read from the plugin's read models (dashboard-reports#2), built from
        domain events. Not paginated: a consultant has tens of clients, not thousands.

        **No `X-Alinha-Tenant`:** this works across the consultant's assigned tenants, never on one chosen by the
        caller (ADR 0002). The set comes from `TenantContext.assignedTenants()`, read from the token, and every query
        is filtered with `tenant_id = ANY(:assigned)` (ADR 0006, "Reading across tenants"). A client without an entry
        has no assessment yet; the page still lists it from the session's organizations.

        The numbers are counts and the coverage the Compliance Engine computed (NFR05). This endpoint does not label a
        client as compliant or not. Permission `portfolio:read`, declared by the dashboard-reports plugin and granted
        to `consultant`.
      responses:
        '200':
          description: The summary, one entry per client that has data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/risk-assets/risk-matrix:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [risk-assets]
      operationId: getRiskMatrix
      summary: The likelihood and impact scales and how they map to a risk level
      description: |
        The scale is configured on the server (`alinha.risk-assets.matrix`), so the UI reads it here instead of
        hardcoding it. A risk's `score` is `likelihood × impact`, and its `level` is the band that contains the
        score. The bands cover every possible score exactly once. Permission `risk:read`
        (consultant, Designated Officer).
      responses:
        '200':
          description: The risk matrix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskMatrix'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/risk-assets/risks:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [risk-assets]
      operationId: listRisks
      summary: The current organization's risk register
      description: |
        Highest `score` first, then most recently changed (risk-assets#4, FR36). Permission `risk:read`
        (consultant, Designated Officer).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of risks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [risk-assets]
      operationId: registerRisk
      summary: Register a risk
      description: |
        Adds a risk to the register (ISO/IEC 27005). `level` and `score` are computed by the server from
        `likelihood` and `impact` with the risk matrix; they are never sent. `likelihood` and `impact` must be
        values of the matrix's scales; otherwise `422` (`code` = `VALIDATION_FAILED`, with one entry per field in
        `errors`: `threat`, `vulnerability`, `likelihood`, `impact` or `treatment`). Audited and published as
        `RiskRegistered`. Permission `risk:edit` (consultant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskInput'
      responses:
        '201':
          description: The new risk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/risk-assets/risks/{riskId}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/RiskId'
    get:
      tags: [risk-assets]
      operationId: getRisk
      summary: One risk
      description: |
        An id of another organization is a `404` (`code` = `RISK_NOT_FOUND`). Permission `risk:read`.
      responses:
        '200':
          description: The risk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [risk-assets]
      operationId: updateRisk
      summary: Update a risk
      description: |
        Replaces the risk's data, for example to reassess it or to choose its treatment. `version` must be the
        one that was read; otherwise `409` (`code` = `VERSION_CONFLICT`) and nothing changes, checked before the
        data, so a stale form is a `409` even with invalid fields. A missing `version` is a `422` with `errors`
        field `version`; invalid data a `422` with one entry per field, as in `registerRisk`. A `likelihood` or
        `impact` the current scale no longer has (the matrix was made smaller) may be sent back unchanged; a new
        value must be on the scale. Sending the data already saved changes nothing (`version` and `updatedAt`
        stay) and writes no audit entry. Permission `risk:edit` (consultant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskUpdate'
      responses:
        '200':
          description: The updated risk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The risk changed since it was read (`code` = `VERSION_CONFLICT`): reload and edit again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/code-repository/connection:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [code-repository]
      operationId: getCodeRepositoryConnection
      summary: The organization's connection to its repository host
      description: |
        `204` when nothing is connected yet. Never contains the token. Permission `code-repository:read`
        (Designated Officer, analyst, consultant).
      responses:
        '200':
          description: The connection and the state of its last collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepositoryConnection'
        '204':
          description: No repository is connected.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [code-repository]
      operationId: connectCodeRepository
      summary: Connect (or change) the repository host and start a collection
      description: |
        Stores the read-only token in OpenBao (never in the database, never returned) and queues an `evidence.collect`
        job (FR37, US37). `token` is required the first time, for another host or server, and after a GitHub App
        connection; otherwise leave it out to keep the stored one. The connection is then collected again every day.
        `repositories` empty means every repository of `account` the token can see (at most 20 per collection).
        `409` (`code` = `COLLECTION_RUNNING`) while a collection is running (less than 15 minutes); `422` names the invalid field;
        `503` (`code` = `SECRETS_UNAVAILABLE`) when the token cannot be stored. Permission `code-repository:connect`
        (Designated Officer, analyst, consultant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRepositoryConnectInput'
      responses:
        '202':
          description: Saved; a collection is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepositoryConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: The token could not be stored.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [code-repository]
      operationId: disconnectCodeRepository
      summary: Remove the connection and its stored token
      description: |
        Evidence already collected is kept. `404` (`code` = `NOT_CONNECTED`) when nothing is connected.
        Permission `code-repository:connect`.
      responses:
        '204':
          description: Disconnected.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The token could not be removed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/code-repository/collections:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    post:
      tags: [code-repository]
      operationId: collectCodeRepositoryEvidence
      summary: Collect the evidence again now
      description: |
        Queues a new collection with the stored credential. `404` (`code` = `NOT_CONNECTED`) when nothing is connected,
        `409` (`code` = `COLLECTION_RUNNING`) while one is running. Permission `code-repository:connect`.
      responses:
        '202':
          description: A collection is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepositoryConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/code-repository/setup:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [code-repository]
      operationId: getCodeRepositorySetup
      summary: What the connect page needs before anything is connected
      description: Whether the aLinha GitHub App can be offered, and who was asked to connect. Permission `code-repository:read`.
      responses:
        '200':
          description: The setup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepositorySetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/code-repository/assignment:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    put:
      tags: [code-repository]
      operationId: assignCodeRepository
      summary: Ask someone, by email, to connect the repository
      description: |
        Saves who was asked and emails them a link to the platform (US37). Connecting still needs
        `code-repository:connect`. `422` (`field` = `email`) for an invalid address. Permission `code-repository:assign`
        (Designated Officer, consultant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRepositoryAssignInput'
      responses:
        '200':
          description: Assigned; the email is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepositoryAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [code-repository]
      operationId: unassignCodeRepository
      summary: Withdraw the request
      description: Nothing happens when nobody was asked. Permission `code-repository:assign`.
      responses:
        '204':
          description: Withdrawn.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/code-repository/github-app/installations:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    post:
      tags: [code-repository]
      operationId: startCodeRepositoryAppInstall
      summary: Start installing the aLinha GitHub App
      description: |
        Returns GitHub's install page with a single-use `state` (valid 15 minutes) bound to this organization. GitHub
        sends the person back to `/resume` (the shell returns them to the plugin page). `503` (`code` =
        `APP_UNAVAILABLE`) when the App is not configured. Permission `code-repository:connect`.
      responses:
        '201':
          description: Where to send the person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepositoryAppInstallStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The GitHub App is not configured.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/code-repository/github-app/installation:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    put:
      tags: [code-repository]
      operationId: completeCodeRepositoryAppInstall
      summary: Connect through the GitHub App that was just installed
      description: |
        Takes what GitHub sent back (`installation_id`, `state`, `code`). The state must be this organization's, unused
        and fresh (`422`, `code` = `APP_INSTALL_EXPIRED`); the installation must be one GitHub shows to the person who
        installed it (`422`, `code` = `APP_INSTALL_NOT_VERIFIED`). Only the installation id is stored; no token.
        `503` (`code` = `GITHUB_UNAVAILABLE`) when GitHub does not answer. Permission `code-repository:connect`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRepositoryAppInstallInput'
      responses:
        '202':
          description: Connected; a collection is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepositoryConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: GitHub or the App is not available.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/code-repository/evidence:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [code-repository]
      operationId: listCodeRepositoryEvidence
      summary: Evidence from the last completed collection
      description: |
        One item per repository and check, ordered by repository then check. Empty before the first collection
        completes. Not paginated: at most 20 repositories × 4 checks. `controlIds` come from a deterministic,
        versioned mapping (NFR05). Permission `code-repository:read`.
      responses:
        '200':
          description: The evidence.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CodeRepositoryEvidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/audit/events:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: History of changes in the current organization
      description: |
        Every recorded write of the current organization, newest first (US09, NFR04). Read-only: the audit
        trail is append-only. Permission `audit:read` (consultant, Designated Officer).

        `actor` is the Keycloak `sub` of the user, or `system` for jobs and event listeners. Names are not
        stored in the audit trail (#75).
      parameters:
        - name: entityType
          in: query
          required: false
          description: Only entries about this kind of entity, e.g. `organization`.
          schema:
            type: string
        - name: entityId
          in: query
          required: false
          description: Only entries about this entity (requires knowing its id).
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: Only entries by this actor (`sub` or `system`).
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on `occurredAt`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on `occurredAt`. `from` after `to` is a `400`.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/{plugin}/ping:
    parameters:
      - name: plugin
        in: path
        required: true
        description: Plugin id exactly as declared in `plugin.yaml`.
        schema:
          type: string
          enum:
            - assessment
            - dashboard-reports
            - notifications
            - organization
            - risk-assets
            - code-repository
            - external-surface
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [internal]
      operationId: pingPlugin
      summary: Walking-skeleton health check (temporary)
      description: |
        Proves that a plugin is wired end to end. It does not read or write tenant data; the shell
        still sends the tenant header because it is inside an organization. Remove this path when
        the plugin exposes its first real endpoint.
      responses:
        '200':
          description: The plugin answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        HttpOnly BFF session cookie. The token never reaches the browser. The BFF owns the cookie
        name; if issue #14 chooses another one, update it here.

  parameters:
    Tenant:
      name: X-Alinha-Tenant
      in: header
      required: false
      description: |
        Tenant UUID chosen by a consultant. Client users may omit it; if sent, it must match their
        own organization. Required for consultants: a missing value is `400`, an unassigned value
        is `403`. Never put the tenant in the path, query or body (ADR 0002).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RiskId:
      name: riskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details with two aLinha extensions.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI, or `about:blank`.
        title:
          type: string
          description: Short, stable summary of the problem.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation. When shown in the UI it is in Portuguese.
        instance:
          type: string
          format: uri-reference
          description: Request path where the problem occurred.
        code:
          type: string
          description: Stable machine-readable code, for example `TENANT_FORBIDDEN`.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Field name or path.
              message:
                type: string
                description: Message for that field, in Portuguese when shown in the UI.

    PageMeta:
      type: object
      description: |
        Base of every paginated response. A plugin extends it with its own `items`:
        `allOf: [$ref PageMeta, { type: object, properties: { items: ... } }]`.
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Total number of matching items across all pages.

    Role:
      type: string
      description: |
        `registrant` is an account created through self-registration that has not registered its
        organization yet (ADR 0004). It has no organizations until it does.
      enum: [consultant, responsible, analyst, registrant]

    OrganizationRef:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
          description: Tenant UUID.
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Used in URLs (`/org/:org`, `/portfolio/:org`).
        name:
          type: string

    User:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Keycloak subject identifier.
        name:
          type: string
        email:
          type: string
          format: email

    Me:
      type: object
      required: [user, roles, permissions, organizations]
      properties:
        user:
          $ref: '#/components/schemas/User'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          description: '"<resource>:<action>" strings computed by the backend from the roles.'
          items:
            type: string
        organizations:
          type: array
          description: |
            The client user's own organization (exactly one), or the consultant's assigned
            organizations (the `tenants` claim). Empty for a `registrant`.
          items:
            $ref: '#/components/schemas/OrganizationRef'

    PluginManifest:
      type: object
      required: [id, name, kind, version, publishes, consumes, permissions, nav]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [FEATURE, FRAMEWORK, PROVIDER]
        version:
          type: string
        publishes:
          type: array
          description: Events the plugin publishes.
          items:
            type: string
        consumes:
          type: array
          description: Events the plugin consumes.
          items:
            type: string
        permissions:
          type: array
          description: Permissions the plugin declares, as `resource:action`.
          items:
            type: string
        nav:
          type: array
          description: >
            Menu entries the caller may see: only areas the caller's roles open, and only entries
            whose permission the caller holds. Sorted within this plugin by area (client, consultant),
            then `order`, then label (Portuguese collation); a menu built from several plugins has to sort
            the merged list again. Never in the onboarding area, which has no menu.
          items:
            $ref: '#/components/schemas/NavEntry'

    NavEntry:
      type: object
      description: Same fields as `NavItem` in `@alinha/plugin-sdk`, minus the icon.
      required: [label, path, area, action, order]
      properties:
        label:
          type: string
          description: Text shown in the menu (European Portuguese).
        path:
          type: string
          description: Path relative to the area root, kebab-case segments, e.g. `organization`.
        area:
          type: string
          enum: [client, consultant, onboarding]
        resource:
          type: string
          description: RBAC resource needed to see the entry, checked as `resource:action`; absent when anyone in the area may.
        action:
          type: string
          description: Action checked with `resource`. Defaults to `read`.
        order:
          type: integer
          description: Lower comes first. Defaults to 100.

    OrganizationAddress:
      type: object
      required: [street, postalCode, city]
      properties:
        street:
          type: string
          maxLength: 300
        postalCode:
          type: string
          pattern: '^\d{4}-\d{3}$'
          examples: ['3750-750']
        city:
          type: string
          maxLength: 120

    OrganizationContacts:
      type: object
      required: [phone, email]
      properties:
        phone:
          type: string
          maxLength: 20
          description: 9 digits starting with 2 or 9; spaces are ignored on input.
        email:
          type: string
          format: email
          maxLength: 254

    PermanentContact:
      type: object
      description: Person the CNCS can reach at any time in case of an incident.
      required: [name, phone]
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 20

    OrganizationProfileInput:
      type: object
      description: |
        Organization data for the NIS2 classification (FR01). Every field listed in `required` is required, and
        `subsector` too when the chosen `sector` has subsectors (a conditional the schema does not express). The
        server validates all of them and answers `422` with one message per missing or invalid field. NIF, CAE and phones may contain spaces, dots or dashes, never letters.
      required: [name, nif, cae, sector, services, employees, turnover, address, contacts, permanentContact]
      properties:
        name:
          type: string
          maxLength: 200
          description: Official name, as in the permanent certificate.
        nif:
          type: string
          maxLength: 20
          description: Portuguese tax number, 9 digits with a valid check digit.
        cae:
          type: string
          maxLength: 20
          description: Main CAE code, 5 digits.
        sector:
          type: string
          maxLength: 40
          description: Sector id from the DL 125/2025 annexes (e.g. `industria`), or `outro`.
        subsector:
          type: [string, 'null']
          maxLength: 40
          description: Required only when the sector has subsectors (e.g. `automoveis`).
        services:
          type: string
          minLength: 10
          maxLength: 2000
        employees:
          type: integer
          minimum: 1
          maximum: 10000000
        turnover:
          type: integer
          minimum: 0
          description: Annual turnover in whole euros.
        address:
          $ref: '#/components/schemas/OrganizationAddress'
        contacts:
          $ref: '#/components/schemas/OrganizationContacts'
        permanentContact:
          $ref: '#/components/schemas/PermanentContact'

    OrganizationProfileUpdate:
      allOf:
        - $ref: '#/components/schemas/OrganizationProfileInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 0
              description: The `version` that was read.

    OrganizationProfile:
      type: object
      required: [id, version, name, nif, cae, sector, subsector, sectorAnnex, services, employees, turnover,
        address, contacts, permanentContact, registeredAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          description: Send it back on update.
        name:
          type: string
        nif:
          type: string
          description: 9 digits.
        cae:
          type: string
          description: 5 digits.
        sector:
          type: string
        subsector:
          type: [string, 'null']
        sectorAnnex:
          type: [string, 'null']
          enum: [I, II, null]
          description: NIS2 annex of the sector; null when the sector is not covered.
        services:
          type: string
        employees:
          type: integer
        turnover:
          type: integer
          description: Annual turnover in whole euros.
        address:
          $ref: '#/components/schemas/OrganizationAddress'
        contacts:
          $ref: '#/components/schemas/OrganizationContacts'
        permanentContact:
          $ref: '#/components/schemas/PermanentContact'
        registeredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PortfolioSummary:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioClientSummary'

    PortfolioClientSummary:
      type: object
      required: [tenantId, coverage, openGaps, pendingValidations, overdueActions, lastAssessedAt]
      properties:
        tenantId:
          type: string
          format: uuid
          description: The client organization (tenant). Match it with `OrganizationRef.id` for the name and slug.
        coverage:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: |
            Share of applicable controls the latest evaluated assessment found in place (0–1), as computed by the
            Compliance Engine. Null when no assessment has been evaluated yet.
        openGaps:
          type: integer
          minimum: 0
          description: Controls with a gap in the latest evaluated assessment.
        pendingValidations:
          type: integer
          minimum: 0
          description: Roadmaps the AI drafted that are waiting for the consultant's validation.
        overdueActions:
          type: integer
          minimum: 0
          description: Roadmap actions past their due date and not done.
        lastAssessedAt:
          type: [string, 'null']
          format: date-time
          description: When the latest assessment was evaluated; null if none.

    StartAssessmentRequest:
      type: object
      required: [framework, scope]
      properties:
        framework:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Framework id, as in `frameworks/<id>/`, e.g. `nis2-qnrcs`, `gdpr`, `ai-act`.
        scope:
          $ref: '#/components/schemas/ApplicabilityInput'

    ApplicabilityInput:
      type: object
      description: |
        **Temporary.** The facts the core applicability rules need (`docs/applicability.md`). Sent on start
        until the core stores each organization's applicability (core#25); then this field is deprecated.
        Mirrors `pt.alinha.core.compliance.ApplicabilityInput`.
        Omitted booleans mean `false`; an omitted `entityTypes` means none.
        Self-declared by the organization and stored as sent with the assessment (see `startAssessment`).
      required: [size, nis2, gdpr, aiAct]
      properties:
        size:
          type: object
          required: [employees, annualTurnoverEur]
          properties:
            employees:
              type: integer
              minimum: 0
            annualTurnoverEur:
              type: integer
              format: int64
              minimum: 0
            annualBalanceSheetEur:
              type: [integer, 'null']
              format: int64
              minimum: 0
              description: Optional. When known, a company can stay in a smaller category.
        publicBody:
          type: boolean
        nis2:
          $ref: '#/components/schemas/Nis2Answers'
        gdpr:
          $ref: '#/components/schemas/GdprAnswers'
        aiAct:
          $ref: '#/components/schemas/AiActAnswers'

    Nis2EntityType:
      type: string
      description: Entity types of NIS2 annexes I and II (`pt.alinha.core.compliance.Nis2EntityType`).
      enum: [ELECTRICITY_SUPPLIER, ELECTRICITY_DISTRIBUTION_OPERATOR, ELECTRICITY_TRANSMISSION_OPERATOR,
        ELECTRICITY_PRODUCER, ELECTRICITY_MARKET_OPERATOR, ELECTRICITY_MARKET_PARTICIPANT,
        CHARGING_POINT_OPERATOR, DISTRICT_HEATING_COOLING, OIL_PIPELINE_OPERATOR, OIL_OPERATOR,
        OIL_CENTRAL_STOCKHOLDING, GAS_SUPPLIER, GAS_DISTRIBUTION_OPERATOR, GAS_TRANSMISSION_OPERATOR,
        GAS_STORAGE_OPERATOR, LNG_OPERATOR, NATURAL_GAS_UNDERTAKING, GAS_REFINING_OPERATOR,
        HYDROGEN_OPERATOR, AIR_CARRIER, AIRPORT, AIR_TRAFFIC_CONTROL, RAIL_INFRASTRUCTURE_MANAGER,
        RAILWAY_UNDERTAKING, WATER_TRANSPORT_COMPANY, PORT_MANAGING_BODY, VESSEL_TRAFFIC_SERVICE,
        ROAD_TRAFFIC_AUTHORITY, INTELLIGENT_TRANSPORT_SYSTEMS, CREDIT_INSTITUTION, TRADING_VENUE,
        CENTRAL_COUNTERPARTY, HEALTHCARE_PROVIDER, EU_REFERENCE_LABORATORY, MEDICINAL_PRODUCT_RESEARCH,
        DRINKING_WATER, WASTE_WATER, INTERNET_EXCHANGE_POINT, DNS_SERVICE_PROVIDER, TLD_NAME_REGISTRY,
        CLOUD_COMPUTING_PROVIDER, DATA_CENTRE_PROVIDER, CONTENT_DELIVERY_NETWORK,
        QUALIFIED_TRUST_SERVICE_PROVIDER, TRUST_SERVICE_PROVIDER, PUBLIC_ELECTRONIC_COMMUNICATIONS_NETWORK,
        PUBLIC_ELECTRONIC_COMMUNICATIONS_SERVICE, MANAGED_SERVICE_PROVIDER,
        MANAGED_SECURITY_SERVICE_PROVIDER, SPACE_GROUND_INFRASTRUCTURE, POSTAL_COURIER, WASTE_MANAGEMENT,
        CHEMICALS, FOOD, MEDICAL_DEVICES, ELECTRONICS_MANUFACTURING, ELECTRICAL_EQUIPMENT_MANUFACTURING,
        MACHINERY_MANUFACTURING, MOTOR_VEHICLE_MANUFACTURING, OTHER_TRANSPORT_EQUIPMENT_MANUFACTURING,
        ONLINE_MARKETPLACE, ONLINE_SEARCH_ENGINE, SOCIAL_NETWORK_PLATFORM, RESEARCH_ORGANISATION]

    Nis2Answers:
      type: object
      properties:
        entityTypes:
          type: array
          uniqueItems: true
          description: Types from NIS2 annexes I and II that describe the organization. Empty when none does.
          items:
            $ref: '#/components/schemas/Nis2EntityType'
        criticalEntity:
          type: boolean
        significantImpact:
          type: boolean
        higherEducation:
          type: boolean

    GdprAnswers:
      type: object
      required: [processesPersonalData]
      description: When `processesPersonalData` is false, every other field must be false (otherwise `422`).
      properties:
        processesPersonalData:
          type: boolean
        regularOrRiskyProcessing:
          type: boolean
        specialOrCriminalData:
          type: boolean
        largeScaleMonitoring:
          type: boolean
        largeScaleSpecialData:
          type: boolean

    AiActAnswers:
      type: object
      description: |
        `highRiskArea` and `interactsOrGeneratesContent` need `usesAiSystems` or `providesAiSystems`
        (otherwise `422`).
      properties:
        usesAiSystems:
          type: boolean
        providesAiSystems:
          type: boolean
        highRiskArea:
          type: boolean
        interactsOrGeneratesContent:
          type: boolean

    Nis2Classification:
      type: string
      enum: [essential, important, not-covered, to-be-assessed]
      description: |
        NIS2 classification (Decree-Law 125/2025). `to-be-assessed`: public bodies and higher-education
        institutions, which a consultant confirms with the CNCS.

    ApplicabilityAnswersUpdate:
      type: object
      required: [gdpr]
      description: |
        The organization's answers for the applicability rules. The size comes from the organization data
        (employees, turnover), so it is not sent here. Omitted booleans mean `false`; an omitted
        `entityTypes` means none.
      properties:
        version:
          type: [integer, 'null']
          format: int64
          description: The `answers.version` that was read; null or omitted on the first save.
        publicBody:
          type: boolean
        annualBalanceSheetEur:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Optional. When known, a company can stay in a smaller category.
        nis2:
          $ref: '#/components/schemas/Nis2Answers'
        gdpr:
          $ref: '#/components/schemas/GdprAnswers'
        aiAct:
          $ref: '#/components/schemas/AiActAnswers'

    CncsQualificationUpdate:
      type: object
      required: [classification, actDate]
      properties:
        version:
          type: [integer, 'null']
          format: int64
          description: The `qualification.version` that was read; null or omitted on the first registration.
        classification:
          type: string
          enum: [essential, important]
          description: The classification in the Qualification Act. The CNCS only qualifies covered entities.
        actDate:
          type: string
          format: date
          description: Date of the Qualification Act. Not in the future, not before 2025-12-04.
        actReference:
          type: [string, 'null']
          maxLength: 100
          description: Optional reference of the Act, as printed on it.

    MemberRole:
      type: string
      enum: [responsible, analyst]

    Member:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          description: The account's id in the identity provider (the token's `sub`).
        name:
          type: [string, 'null']
          description: First and last name from the account; null when it has none.
        email:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/MemberRole'

    Invitation:
      type: object
      required: [id, email, createdAt, expiresAt, expired]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: In lower case, as invited.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        expired:
          type: boolean
          description: Past `expiresAt`; inviting the same email again sends a new one.

    InvitationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254

    IssuedInvitation:
      type: object
      required: [id, email, createdAt, expiresAt, token]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
          description: |
            The invitation's secret, returned only here and never stored in clear. The link is
            `/onboarding/invitation#<token>`.

    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 64
          description: The secret from the invitation link's fragment.

    OrganizationScope:
      type: object
      required: [answers, result, qualification, nis2, entityTypes]
      properties:
        answers:
          description: The saved answers; null until the first save.
          oneOf:
            - $ref: '#/components/schemas/ApplicabilityAnswers'
            - type: 'null'
        result:
          description: Computed on every read from `answers` and the organization data; null without answers.
          oneOf:
            - $ref: '#/components/schemas/ApplicabilityResult'
            - type: 'null'
        qualification:
          description: The official CNCS qualification; null until registered.
          oneOf:
            - $ref: '#/components/schemas/CncsQualification'
            - type: 'null'
        nis2:
          description: The NIS2 classification that counts; null with neither answers nor qualification.
          oneOf:
            - $ref: '#/components/schemas/Nis2Status'
            - type: 'null'
        entityTypes:
          type: array
          description: Every NIS2 entity type, in annex order, for the user to pick from.
          items:
            $ref: '#/components/schemas/EntityTypeOption'

    ApplicabilityAnswers:
      type: object
      required: [version, publicBody, annualBalanceSheetEur, nis2, gdpr, aiAct, answeredAt, updatedAt]
      properties:
        version:
          type: integer
          format: int64
        publicBody:
          type: boolean
        annualBalanceSheetEur:
          type: [integer, 'null']
          format: int64
        nis2:
          $ref: '#/components/schemas/Nis2Answers'
        gdpr:
          $ref: '#/components/schemas/GdprAnswers'
        aiAct:
          $ref: '#/components/schemas/AiActAnswers'
        answeredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplicabilityResult:
      type: object
      required: [rulesVersion, size, nis2Classification, cncsMayQualify, indicative, frameworks]
      properties:
        rulesVersion:
          type: string
          description: Version of the applicability rules that produced this result (NFR05).
        size:
          type: string
          enum: [micro, small, medium, large]
          description: Company size from the employees, turnover and, when given, the balance sheet.
        nis2Classification:
          $ref: '#/components/schemas/Nis2Classification'
        cncsMayQualify:
          type: boolean
          description: The CNCS may still cover the organization or raise its classification.
        indicative:
          type: boolean
          description: Always true; the official qualification is the CNCS's.
        frameworks:
          type: array
          description: NIS2 (`nis2-qnrcs`), GDPR (`gdpr`) and the AI Act (`ai-act`), in that order.
          items:
            $ref: '#/components/schemas/FrameworkApplicability'

    FrameworkApplicability:
      type: object
      required: [framework, applies, findings]
      properties:
        framework:
          type: string
          description: Framework id, as in `frameworks/<id>/`.
        applies:
          type: string
          enum: [yes, no, review]
          description: '`review`: depends on facts the rules cannot judge; a consultant (or the CNCS) decides.'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ApplicabilityFinding'

    ApplicabilityFinding:
      type: object
      required: [id, legalBasis, explanation, review]
      properties:
        id:
          type: string
          description: Stable id of the rule, e.g. `nis2.essential.any-size`.
        legalBasis:
          type: string
          description: Article of the law, in Portuguese.
        explanation:
          type: string
          description: Plain-language explanation for the user, in European Portuguese.
        review:
          type: boolean
          description: A consultant must confirm this conclusion.

    CncsQualification:
      type: object
      required: [version, classification, actDate, actReference, registeredAt, updatedAt]
      properties:
        version:
          type: integer
          format: int64
        classification:
          type: string
          enum: [essential, important]
        actDate:
          type: string
          format: date
        actReference:
          type: [string, 'null']
        registeredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Nis2Status:
      type: object
      required: [classification, official, suggested]
      properties:
        classification:
          $ref: '#/components/schemas/Nis2Classification'
        official:
          type: boolean
          description: True when `classification` comes from the CNCS Qualification Act.
        suggested:
          description: The indicative classification from the rules; null without answers.
          oneOf:
            - $ref: '#/components/schemas/Nis2Classification'
            - type: 'null'

    EntityTypeOption:
      type: object
      required: [id, annex, reference, label, suggested]
      properties:
        id:
          $ref: '#/components/schemas/Nis2EntityType'
        annex:
          type: string
          enum: [I, II]
        reference:
          type: string
          description: Annex row, e.g. `Anexo I, 8.`.
        label:
          type: string
          description: Plain-language name, in European Portuguese.
        suggested:
          type: boolean
          description: Suggested by the organization's sector, subsector or CAE. Never ticked for the user.

    AssessmentStatus:
      type: string
      enum: [draft, submitted, evaluated, validated]
      description: Lifecycle. Answers change only in `draft`.

    ComplianceLevel:
      type: string
      enum: [basic, substantial, high]

    AnswerValue:
      type: string
      enum: [yes, partial, no, unknown]

    Progress:
      type: object
      required: [answered, total]
      properties:
        answered:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    AssessmentSummary:
      type: object
      required: [id, framework, catalogueVersion, status, progress, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        framework:
          type: string
        catalogueVersion:
          type: integer
          minimum: 1
          description: Catalogue version fixed at start (`frameworks/<framework>/v<n>/`).
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        progress:
          $ref: '#/components/schemas/Progress'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Last real change, including the last answer saved.

    AssessmentDetail:
      allOf:
        - $ref: '#/components/schemas/AssessmentSummary'
        - type: object
          required: [catalogueTitle, nis2Classification, maxLevel, rulesVersion, controls]
          properties:
            catalogueTitle:
              type: string
            nis2Classification:
              type: string
              enum: [essential, important, not-covered, to-be-assessed]
              description: Indicative, from the applicability rules at start. The official one is the CNCS's.
            maxLevel:
              $ref: '#/components/schemas/ComplianceLevel'
            rulesVersion:
              type: string
              description: Version of the applicability rules used at start (NFR05).
            controls:
              type: array
              description: Controls up to `maxLevel`, in catalogue order.
              items:
                $ref: '#/components/schemas/QuestionnaireControl'

    QuestionnaireControl:
      type: object
      required: [id, title, level, technical, questions]
      properties:
        id:
          type: string
        title:
          type: string
        level:
          $ref: '#/components/schemas/ComplianceLevel'
        technical:
          type: boolean
          description: Questions an analyst usually answers.
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnaireQuestion'

    QuestionnaireQuestion:
      type: object
      required: [id, text, explanation, example, options, answer, answeredAt]
      properties:
        id:
          type: string
        text:
          type: string
        explanation:
          type: string
        example:
          type: string
        options:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/AnswerValue'
        answer:
          description: The saved answer; null while unanswered.
          oneOf:
            - $ref: '#/components/schemas/AnswerValue'
            - type: 'null'
        answeredAt:
          type: [string, 'null']
          format: date-time

    SaveAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer:
          $ref: '#/components/schemas/AnswerValue'

    SavedAnswer:
      type: object
      required: [questionId, answer, answeredAt, progress]
      properties:
        questionId:
          type: string
        answer:
          $ref: '#/components/schemas/AnswerValue'
        answeredAt:
          type: string
          format: date-time
          description: Unchanged when the same value is sent again.
        progress:
          $ref: '#/components/schemas/Progress'

    AssessmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AssessmentSummary'

    AssessmentAlreadyOpenProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [assessmentId]
          properties:
            assessmentId:
              type: string
              format: uuid
              description: The open assessment of this framework.

    AssessmentIncompleteProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [unanswered]
          properties:
            unanswered:
              type: array
              minItems: 1
              items:
                type: string
              description: Ids of the questions with no answer, in catalogue order.

    ControlStatus:
      type: string
      enum: [compliant, partial, gap]
      description: |
        From the control's answers: `compliant` when every answer is `yes`; `gap` when any is `no` or `unknown`;
        `partial` otherwise (some `partial`). `partial` and `gap` both count as gaps for the roadmap.

    ControlResult:
      type: object
      required: [controlId, title, level, status]
      properties:
        controlId:
          type: string
        title:
          type: string
        level:
          $ref: '#/components/schemas/ComplianceLevel'
        status:
          $ref: '#/components/schemas/ControlStatus'

    AssessmentResults:
      type: object
      required: [assessmentId, evaluatedAt, engineVersion, currentLevel, targetLevel, coverage, controls]
      properties:
        assessmentId:
          type: string
          format: uuid
        evaluatedAt:
          type: string
          format: date-time
        engineVersion:
          type: string
          description: Version of the Compliance Engine rules that computed these results (NFR05).
        currentLevel:
          description: |
            Highest level whose controls, and those of every level below, are all `compliant`. Null when a
            `basic` control is not.
          oneOf:
            - $ref: '#/components/schemas/ComplianceLevel'
            - type: 'null'
        targetLevel:
          $ref: '#/components/schemas/ComplianceLevel'
        coverage:
          type: number
          minimum: 0
          maximum: 1
          description: Share of the assessment's controls that are `compliant`.
        controls:
          type: array
          description: Every control of the assessment, in catalogue order.
          items:
            $ref: '#/components/schemas/ControlResult'

    RiskLevel:
      type: string
      enum: [low, medium, high]
      description: Computed by the server from the risk matrix; never sent by the client.

    RiskTreatment:
      type: string
      enum: [mitigate, accept, transfer, avoid]
      description: |
        ISO/IEC 27005 risk treatment option: reduce the risk (`mitigate`), keep it (`accept`), share it with
        someone else, such as an insurer or a supplier (`transfer`), or stop the activity that causes it (`avoid`).

    RiskScaleStep:
      type: object
      required: [value, label, description]
      properties:
        value:
          type: integer
          minimum: 1
        label:
          type: string
          description: Short name, in Portuguese (e.g. `Alta`).
        description:
          type: string
          description: What the value means, in plain Portuguese, to help choose it.

    RiskBand:
      type: object
      required: [level, minScore, maxScore]
      properties:
        level:
          $ref: '#/components/schemas/RiskLevel'
        minScore:
          type: integer
          minimum: 1
        maxScore:
          type: integer
          minimum: 1

    RiskMatrix:
      type: object
      required: [likelihood, impact, bands]
      properties:
        likelihood:
          type: array
          description: Likelihood scale, lowest first.
          items:
            $ref: '#/components/schemas/RiskScaleStep'
        impact:
          type: array
          description: Impact scale, lowest first.
          items:
            $ref: '#/components/schemas/RiskScaleStep'
        bands:
          type: array
          description: Score ranges of each level, lowest first. Every possible score falls in exactly one band.
          items:
            $ref: '#/components/schemas/RiskBand'

    RiskInput:
      type: object
      required: [threat, likelihood, impact]
      properties:
        assetId:
          type: [string, 'null']
          format: uuid
          description: |
            The asset at risk, or null for a risk to the whole organization. Not checked against the asset
            inventory yet (risk-assets#2).
        threat:
          type: string
          minLength: 1
          maxLength: 200
          description: What could happen (e.g. `Ransomware cifra o servidor de ficheiros`).
        vulnerability:
          type: [string, 'null']
          maxLength: 500
          description: The weakness the threat would exploit (e.g. `Cópias de segurança no mesmo servidor`).
        likelihood:
          type: integer
          minimum: 1
          description: A `value` of the risk matrix's likelihood scale.
        impact:
          type: integer
          minimum: 1
          description: A `value` of the risk matrix's impact scale.
        treatment:
          oneOf:
            - $ref: '#/components/schemas/RiskTreatment'
            - type: 'null'
          description: Null while the treatment is not decided.
        ownerId:
          type: [string, 'null']
          format: uuid
          description: |
            Account responsible for the risk (the token's `sub`), or null. Not checked against the organization's
            members until they exist (organization#6).

    RiskUpdate:
      allOf:
        - $ref: '#/components/schemas/RiskInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 0
              description: The `version` that was read.

    Risk:
      type: object
      required: [id, version, assetId, threat, vulnerability, likelihood, impact, score, level, treatment, ownerId,
                 createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
          description: Changes whenever the risk's data changes; send it back in `RiskUpdate`.
        assetId:
          type: [string, 'null']
          format: uuid
        threat:
          type: string
        vulnerability:
          type: [string, 'null']
        likelihood:
          type: integer
          minimum: 1
        impact:
          type: integer
          minimum: 1
        score:
          type: integer
          minimum: 1
          description: '`likelihood × impact`.'
        level:
          $ref: '#/components/schemas/RiskLevel'
        treatment:
          oneOf:
            - $ref: '#/components/schemas/RiskTreatment'
            - type: 'null'
        ownerId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RiskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Risk'

    AuditEvent:
      type: object
      required: [id, actor, action, entityType, entityId, details, provenance, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
          description: Keycloak `sub` of the user who made the change, or `system`.
        action:
          type: string
          description: '`<entity>.<verb>`, e.g. `organization.updated`.'
        entityType:
          type: string
        entityId:
          type: string
        details:
          type: object
          additionalProperties: true
          description: |
            Ids and names of changed fields, as recorded by the writer. Never secrets or personal data
            beyond ids (docs/audit.md). Visible to the client.
        provenance:
          oneOf:
            - $ref: '#/components/schemas/AiProvenance'
            - type: 'null'
          description: Set when the change stored AI-generated content (NFR14).
        occurredAt:
          type: string
          format: date-time

    AiProvenance:
      type: object
      description: Where AI-generated content came from (NFR14).
      required: [model, promptVersion, sources, generatedAt]
      properties:
        model:
          type: string
        promptVersion:
          type: string
        sources:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time

    AuditEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditEvent'

    Ping:
      type: object
      required: [plugin, status]
      properties:
        plugin:
          type: string
        status:
          type: string
          enum: [ok]

    CodeRepositoryConnection:
      type: object
      required: [host, auth, account, repositories, status, truncated, connectedAt]
      properties:
        host:
          type: string
          enum: [github, gitlab]
        baseUrl:
          type: [string, 'null']
          description: Self-managed GitLab server (`https://host[:port]`); null for github.com and gitlab.com.
        auth:
          type: string
          enum: [token, app]
          description: '`token`: a read-only access token; `app`: the aLinha GitHub App installed by the client.'
        account:
          type: string
          description: GitHub user or organization, or GitLab group (with subgroups) or user path.
        repositories:
          type: array
          description: |
            `owner/name` (GitLab: the project path). Empty: every repository of `account` the credential can see (with
            the App, the ones chosen when installing it).
          items:
            type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, FAILED]
          description: PENDING while a collection is queued or running; FAILED says why in `lastError`.
        lastError:
          type: [string, 'null']
          description: |
            Error code of the last failed collection (`invalid_credentials`, `connection_not_found`, `invalid_result`,
            `transient_error`, `collector_error`, ...). The page turns it into a sentence.
        lastCollectedAt:
          type: [string, 'null']
          format: date-time
        collectingSince:
          type: [string, 'null']
          format: date-time
          description: When the current (or last) collection was queued. A PENDING one older than 15 minutes is
            treated as lost, and a new collection may start.
        truncated:
          type: boolean
          description: The account has more repositories than one collection inspects (20).
        connectedAt:
          type: string
          format: date-time
    CodeRepositoryConnectInput:
      type: object
      required: [host, account]
      properties:
        host:
          type: string
          enum: [github, gitlab]
        baseUrl:
          type: string
          description: Only for a self-managed GitLab, `https://host[:port]`. Leave out for gitlab.com.
        account:
          type: string
          maxLength: 255
        repositories:
          type: array
          maxItems: 20
          items:
            type: string
            description: '`owner/name` inside `account` (GitLab: a project path, possibly in a subgroup).'
        token:
          type: string
          maxLength: 512
          writeOnly: true
          description: |
            Read-only access token. Required the first time, for another host or server and after a GitHub App
            connection; leave out to keep the stored one.
    CodeRepositoryEvidence:
      type: object
      required: [id, repository, check, outcome, details, controlIds, strength, collectedAt]
      properties:
        id:
          type: string
          format: uuid
        repository:
          type: string
        check:
          type: string
          enum: [branch_protection, required_reviews, dependency_alerts, secret_scanning]
        outcome:
          type: string
          enum: [PASS, FAIL, UNKNOWN]
          description: UNKNOWN when the token could not see it; it is not evidence for any control.
        details:
          type: object
          description: Counts and flags only (e.g. `requiredApprovals`, `openCriticalOrHigh`, `enabled`).
          additionalProperties:
            type: [boolean, integer, string]
        controlIds:
          type: array
          items:
            type: string
        strength:
          type: string
          enum: [SELF_REPORTED, DOCUMENT_VERIFIED, TECHNICALLY_VERIFIED, CONTINUOUSLY_VERIFIED]
          description: CONTINUOUSLY_VERIFIED when the daily collection found it and the previous one succeeded within a day.
        collectedAt:
          type: string
          format: date-time
    CodeRepositorySetup:
      type: object
      required: [githubApp]
      properties:
        githubApp:
          type: boolean
          description: The aLinha GitHub App is configured, so the page can offer it instead of a token.
        assignment:
          oneOf:
            - $ref: '#/components/schemas/CodeRepositoryAssignment'
            - type: 'null'
    CodeRepositoryAssignment:
      type: object
      required: [email, assignedAt]
      properties:
        email:
          type: string
          format: email
        assignedAt:
          type: string
          format: date-time
    CodeRepositoryAssignInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    CodeRepositoryAppInstallStart:
      type: object
      required: [installUrl]
      properties:
        installUrl:
          type: string
          format: uri
    CodeRepositoryAppInstallInput:
      type: object
      required: [installationId, state, code]
      properties:
        installationId:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          writeOnly: true
        code:
          type: string
          writeOnly: true

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The tenant or permission does not allow this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The request is syntactically valid but failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
