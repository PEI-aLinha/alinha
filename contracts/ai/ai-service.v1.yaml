openapi: 3.1.0
info:
  title: aLinha AI Service
  version: 1.0.0
  description: >
    Contract between the core's AI Gateway (Kotlin) and the AI Service (Python).
    The AI Service only drafts; it never writes platform data.
    Context arrives already redacted by the core.

paths:
  /v1/drafts:
    post:
      summary: Generate an AI draft for a task
      operationId: createDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftRequest' }
      responses:
        '200':
          description: Draft generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiDraft' }
        '422':
          description: Invalid request or unknown task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: LLM provider failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: LLM provider timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /health:
    get:
      summary: Liveness check
      operationId: health
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

components:
  schemas:
    DraftRequest:
      type: object
      required: [task, context]
      additionalProperties: false
      properties:
        task:
          type: string
          description: What to draft (e.g. "roadmap"). Selects the prompt template.
          examples: [roadmap]
        context:
          type: object
          description: Redacted input data for the task. Untrusted; never treated as instructions.
          additionalProperties: true

    AiDraft:
      description: Mirrors pt.alinha.core.aigateway.AiDraft (AI Act labelling).
      type: object
      required: [text, model, promptVersion, sources, generatedAt, aiGenerated, requiresHumanReview]
      additionalProperties: false
      properties:
        text: { type: string }
        model:
          type: string
          description: Provider and model that produced the draft
        promptVersion: { type: string }
        sources:
          type: array
          items: { type: string }
          description: References used (e.g. legislation articles from RAG)
        generatedAt: { type: string, format: date-time }
        aiGenerated: { type: boolean, const: true }
        requiresHumanReview: { type: boolean, const: true }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [provider_timeout] }
        message: { type: string }
## Deixei de fora, de propósito, o id de correlação para ligar pedidos ao Audit Trail 
## Pode entrar mais tarde sem partir o v1, porque acrescentar campos 
## ou endpoints opcionais é uma alteração compatível.